<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Empleado - Planifest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/empleado.css}">
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="brand text-center p-3">
                <img th:src="@{/images/dashboard/empleado.png}" alt="Perfil" class="rounded-circle mb-2" width="80"
                    height="80">
                <h5 class="mb-0"><span sec:authentication="name">Empleado</span></h5>
                <p class="text-muted" th:text="${empleado.position != null ? empleado.position.name : 'Sin asignar'}">Cargo</p>
                <p class="text-muted" th:text="${empleado?.email} ?: 'empleado@ejemplo.com'">empleado@ejemplo.com</p>
                <a th:href="@{/employee-profile/edit}" class="btn btn-outline-light btn-sm mt-2">
                    <i class="bx bx-edit"></i> Editar perfil
                </a>
            </div>

            <div class="text-center mt-auto mb-3">
                <form method="post" th:action="@{/logout}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="logout-button">
                        <i class="bx bx-log-out"></i> Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>

        <!-- Contenido principal -->
        <div id="content" class="main">
            <main class="p-4">
                <h1 class="mb-4" th:text="'Bienvenida ' + ${empleado.username}">Panel del empleado</h1>

                <!-- Mensajes de éxito/error -->
                <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bx bx-check-circle"></i>
                    <span th:text="${mensajeExito}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bx bx-error-circle"></i>
                    <span th:text="${mensajeError}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Filtros -->
                <div class="row mb-4 justify-content-center">
                    <div class="col-md-3">
                        <label for="fecha" class="form-label fw-semibold">Fecha</label>
                        <input type="date" id="fecha" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="estado" class="form-label fw-semibold">Estado</label>
                        <select id="estado" class="form-select">
                            <option value="">Todos</option>
                            <option value="PENDING">Pendiente</option>
                            <option value="IN_PROGRESS">En progreso</option>
                            <option value="COMPLETED">Completado</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="evento" class="form-label fw-semibold">Evento</label>
                        <input type="text" id="evento" class="form-control" placeholder="Buscar evento o ubicación...">
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="button" onclick="filtrarTareas()" class="btn btn-gold w-100">Filtrar</button>
                        <button type="button" onclick="limpiarFiltros()" class="btn btn-secondary w-100">Limpiar</button>
                    </div>
                </div>

                <!-- Tabla de tareas -->
                <div class="table-responsive bg-white rounded shadow p-3">
                    <table class="table table-bordered table-hover">
                        <thead class="text-center">
                            <tr>
                                <th>Evento</th>
                                <th>Ubicación</th>
                                <th>Tarea</th>
                                <th>Descripción</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-tareas-body">
                            <tr th:each="tarea : ${tareasAsignadas}">
                                <td th:text="${tarea.event?.eventName} ?: 'Sin evento'"></td>
                                <td>
                                    <a href="javascript:void(0)"
                                       th:text="${tarea.event?.location} ?: 'Sin ubicación'"
                                       th:attr="onclick=|mostrarUbicacion('${tarea.event?.location}')|">
                                    </a>
                                </td>
                                <td th:text="${tarea.name} ?: '-'"></td>
                                <td th:text="${tarea.description} ?: '-'"></td>
                                <td th:text="${#temporals.format(tarea.date, 'yyyy-MM-dd')}"></td>
                                <td th:text="${#temporals.format(tarea.date, 'HH:mm')}"></td>
                                <td th:text="${tarea.status == 'PENDING' ? 'Pendiente' : (tarea.status == 'IN_PROGRESS' ? 'En progreso' : (tarea.status == 'COMPLETED' ? 'Completado' : tarea.status))}"></td>
                            </tr>
                            <tr th:if="${tareasAsignadas == null or #lists.isEmpty(tareasAsignadas)}">
                                <td colspan="7" class="text-center text-muted">No hay tareas asignadas</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Mapa -->
                <div id="map" style="width: 100%; height: 400px; margin-top: 20px;"></div>

                <script>
                    let map;
                    let geocoder;

                    function initMap() {
                        map = new google.maps.Map(document.getElementById("map"), {
                            center: { lat: 4.7110, lng: -74.0721 },
                            zoom: 13,
                        });
                        geocoder = new google.maps.Geocoder();
                    }

                    function mostrarUbicacion(direccion) {
                        if (!direccion) return;
                        geocoder.geocode({ address: direccion }, (results, status) => {
                            if (status === "OK") {
                                map.setCenter(results[0].geometry.location);
                                new google.maps.Marker({
                                    map: map,
                                    position: results[0].geometry.location,
                                });
                            } else {
                                alert("No se encontró la dirección: " + status);
                            }
                        });
                    }

                    // Filtros en JS
                    let tareasOriginales = /*[[${tareasAsignadas}]]*/ [];
                    function filtrarTareas() {
                        const fecha = document.getElementById('fecha').value;
                        const estado = document.getElementById('estado').value;
                        const evento = document.getElementById('evento').value.toLowerCase();
                        const tbody = document.getElementById('tabla-tareas-body');
                        tbody.innerHTML = '';

                        const filtradas = tareasOriginales.filter(t => {
                            const coincideFecha = !fecha || (t.date && t.date.startsWith(fecha));
                            const coincideEstado = !estado || (t.status && t.status === estado);
                            const coincideEvento = !evento || (t.event && ((t.event.eventName && t.event.eventName.toLowerCase().includes(evento)) || (t.event.location && t.event.location.toLowerCase().includes(evento))));
                            return coincideFecha && coincideEstado && coincideEvento;
                        });

                        if (filtradas.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No hay tareas para estos filtros.</td></tr>';
                            return;
                        }

                        filtradas.forEach(t => {
                            const fecha = t.date ? t.date.substring(0, 10) : '';
                            const hora = t.date ? t.date.substring(11, 16) : '';
                            const estadoTexto = t.status === 'PENDING' ? 'Pendiente' : (t.status === 'IN_PROGRESS' ? 'En progreso' : (t.status === 'COMPLETED' ? 'Completado' : t.status));
                            tbody.innerHTML += `
                                <tr>
                                    <td>${t.event ? t.event.eventName : 'Sin evento'}</td>
                                    <td>${t.event ? t.event.location : 'Sin ubicación'}</td>
                                    <td>${t.name || '-'}</td>
                                    <td>${t.description || '-'}</td>
                                    <td>${fecha}</td>
                                    <td>${hora}</td>
                                    <td>${estadoTexto}</td>
                                </tr>
                            `;
                        });
                    }

                    function limpiarFiltros() {
                        document.getElementById('fecha').value = '';
                        document.getElementById('estado').value = '';
                        document.getElementById('evento').value = '';
                        filtrarTareas();
                    }
                </script>

                <!-- API Google Maps -->
                 <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCgZPwudO2MG358I1CqrzctaVrIfclADcQ&callback=initMap">
    </script>


            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
