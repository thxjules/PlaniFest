<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifest - Lista de Suministros ⛺</title>
    <link rel="stylesheet" th:href="@{/css/supply.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container py-5">
    <div class="header-section text-center mb-5">
        <img th:src="@{/images/planifest.png}" alt="Logo Planifest" style="max-height: 300px;">
        <h1>📝 Gestión de Suministros</h1>
    </div>

    <!-- MENSAJE DE ERROR Y BOTÓN NUEVO Suministro -->
    <div class="text-end mb-3">
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/dashboard/stock" class="btn btn-outline-secondary btn-sm">🏠 Volver</a>
        <button class="btn btn-outline-primary btn-sm"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#formularioSuministro"
                aria-expanded="false"
                aria-controls="formularioSuministro">
            ➕ Nuevo Suministro
        </button>
    </div>
    </div>

    <!-- FORMULARIO DE Suministro -->
    <div th:class="${supply.id != null} ? 'collapse show' : 'collapse'" id="formularioSuministro">
        <div class="card shadow-sm border-0 mb-4 fondo-transparente">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="${supply.id != null} ? 'Editar Suministro' : 'Nuevo Suministro'">Formulario de Suministro</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/supplies-view/save}" method="post" th:object="${supply}">
                    <input type="hidden" th:field="*{id}" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{name}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tipo de suministro</label>
                            <input type="text" th:field="*{supplyType}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Lugar del almacén</label>
                            <input type="text" th:field="*{storageLocation}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="AVAILABLE">Disponible</option>
                                <option value="UNAVAILABLE">No Disponible</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock Mínimo</label>
                            <input type="number" min="0" th:field="*{minStock}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock Actual</label>
                            <input type="number" min="0" th:field="*{currentStock}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock Máximo</label>
                            <input type="number" min="0" th:field="*{maxStock}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Unidad de empaquetado</label>
                            <input type="text" th:field="*{packagingUnit}" class="form-control" required />
                        </div>
                    </div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success btn-sm">
                            <span th:text="${supply.id != null} ? '🔄 Actualizar Suministro' : '💾 Guardar Suministro'">💾 Guardar Suministro</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
<!-- FILTROS -->
    <form method="get" th:action="@{/supplies-view}" class="mb-4">
    <div class="row g-3 align-items-end">

        <!-- Nombre -->
        <div class="col-md-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" th:value="${nombre}" placeholder="Sillas blancas">
        </div>

        <div class="col-md-3">
            <label for="lugarAlmacen" class="form-label">Lugar de Almacenaje</label>
            <input type="text" id="lugarAlmacen" name="lugarAlmacen" class="form-control" th:value="${lugarAlmacen}" placeholder="EJ: Almacen numero x">
        </div>

        <div class="col-md-3">
            <label for="lugarAlmacen" class="form-label">Cantidad del suministro</label>
            <input type="number" id="stockActual" name="stockActual" class="form-control" th:value="${stockActual}" placeholder="5">
        </div>

        <!-- Botones -->
        <div class="col-md-2 filtro-botones">
    <button type="submit" class="btn btn-outline-primary btn-planifest"> Filtrar Suministro 🔎</button>
    <a href="/supplies-view" class="btn btn-outline-secondary btn-planifest">Limpiar 🧹</a>
</div>

    </div>
</form>

    <!-- TABLA DE Suministros -->
    <div class="contenedor-tabla">
        <div class="card shadow-sm border-0 fondo-transparente">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">📋 Lista de Suministros</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo de suministro</th>
                                <th>Descripción</th>
                                <th>Almacén Localizado</th>
                                <th>Estado</th>
                                <th>Stock Actual</th>
                                <th>Stock Mínimo</th>
                                <th>Stock Máximo</th>
                                <th>Unidad</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${suministros}">
                                <td th:text="${t.name}"></td>
                                <td th:text="${t.supplyType}"></td>
                                <td th:text="${t.description}"></td>
                                <td th:text="${t.storageLocation}"></td>
                                <td>
                                    <span th:classappend="${t.status == 'AVAILABLE'} ? 'badge bg-success' : 'badge bg-warning text-dark'" th:text="${t.status}"></span>
                                </td>
                                <td th:text="${t.currentStock}"></td>
                                <td th:text="${t.minStock}"></td>
                                <td th:text="${t.maxStock}"></td>
                                <td th:text="${t.packagingUnit}"></td>
                                <td class="text-center">
                                    <a th:href="@{/supplies-view(id=${t.id})}" class="btn btn-sm btn-outline-primary me-1">✏️</a>
                                    <a th:href="@{/supplies-view/delete/{id}(id=${t.id})}"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Estás seguro de que deseas eliminar este suministro?');">
                                    🗑</a>

                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>
<script>
  const stockInput = document.getElementById("currentStock");
  stockInput.addEventListener("keydown", e => e.preventDefault()); // evita teclear
  stockInput.addEventListener("paste", e => e.preventDefault());   // evita pegar
</script>
</body>
</html>
