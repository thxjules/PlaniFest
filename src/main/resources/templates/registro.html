<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Planifest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/registro.css}">
  <link rel="icon"  th:href="@{/images/planifest.png}" type="image/png">

</head>

<body>
  <div class="register-container">
    <h2 class="text-center mb-4">Crear Cuenta</h2>

    <!-- MENSAJE DE ÉXITO -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill"></i>
      <strong>¡Sus datos han sido registrados correctamente!</strong>
      <br>Será redirigido al inicio de sesión en unos segundos.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      <script>
        setTimeout(() => {
          window.location.href = /*[[@{/login}]]*/ '/login';
        }, 6000);
      </script>
    </div>

    <!-- MENSAJE DE ERROR -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <form th:action="@{/registro}" th:object="${user}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" id="username" th:field="*{username}" required />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" required />
      </div>

      <div class="mb-3">
        <label for="phoneNumber" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" th:field="*{password}" required />
      </div>

      <div class="mb-3">
        <label for="confirm" class="form-label">Confirmar Contraseña</label>
        <input type="password" class="form-control" id="confirm" name="confirmPassword" required />
      </div>

      <button type="submit" class="btn btn-custom w-100">Registrarse</button>
    </form>

    <div class="text-center mt-3">
      <span>¿Ya tienes cuenta?</span>
      <a th:href="@{/login}">Inicia sesión</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
