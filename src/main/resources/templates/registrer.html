<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - PLaniFest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>

<body>
  <div class="register-container">
    <h2 class="text-center mb-4">Crear Cuenta</h2>

    <!-- ERROR: aparece arriba sin borrar datos -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle"></i>
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- CONFIRMACIÓN: aparece y luego redirige -->
    <div th:if="${success}">
      <script>
        alert("Cuenta creada con éxito. Serás redirigido al login.");
        window.location.href = /*[[@{/login}]]*/ '/login';
      </script>
    </div>

    <form th:action="@{/registro}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" id="username" name="username"
               th:value="${username}" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="email" name="email"
               th:value="${email}" required />
      </div>
      <div class="mb-3">
        <label for="phoneNumber" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
               th:value="${phoneNumber}" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required />
      </div>
      <div class="mb-3">
        <label for="confirm" class="form-label">Confirmar Contraseña</label>
        <input type="password" class="form-control" id="confirm" name="confirmPassword" required />
      </div>
      <button type="submit" class="btn btn-custom w-100">Registrarse</button>
    </form>

    <div class="text-center mt-3">
      <span>¿Ya tienes cuenta?</span>
      <a th:href="@{/login}">Inicia sesión</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
