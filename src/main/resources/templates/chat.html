<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBot – Planifest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fdf8f0;
            margin: 0;
            padding: 0;
        }
        #chat-container {
            width: 400px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .msg {
            margin: 5px 0;
            padding: 8px;
            border-radius: 6px;
        }
        .user {
            background: #d1f0ff;
            text-align: right;
        }
        .bot {
            background: #e7e7e7;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <h2>Chat Planifest</h2>

        <div id="messages"></div>

        <input type="text" id="userInput" placeholder="Escribe un mensaje..." style="width: 75%; padding: 8px;">
        <button onclick="sendMessage()" style="padding: 8px;">Enviar</button>
    </div>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const userText = input.value.trim();

    if (userText === "") return;

    appendMessage(userText, "user");
    input.value = "";

    try {
        const response = await fetch("/chatbot/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userText })
        });

        if (!response.ok) {
            throw new Error("Respuesta no válida del servidor");
        }

        const data = await response.json();
        appendMessage(data.reply, "bot");

    } catch (error) {
        console.error("Error:", error);
        appendMessage("Error en el servidor.", "bot");
    }
}

function appendMessage(text, type) {
    const messageBox = document.getElementById("messages");
    const div = document.createElement("div");

    div.className = "msg " + type;
    div.textContent = text;

    messageBox.appendChild(div);
    messageBox.scrollTop = messageBox.scrollHeight;
}
</script>

</body>
</html>
