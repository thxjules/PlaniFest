<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Papelera - [[${entityType}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f7f2;
            font-family: 'Segoe UI', sans-serif;
        }
        h2 {
            color: #2b3a30;
        }
        .table thead {
            background-color: #f5d99b; /* color mostaza */
            color: #2b3a30;
        }
        .table tbody tr {
            background-color: #ffffff;
        }
        .btn-restore {
            background-color: #2b3a30; /* verde oscuro */
            color: #f7f7f2;
            border-radius: 0.25rem;
        }
        .btn-restore:hover {
            background-color: #465043;
        }
        .btn-back {
            background-color: #f5d99b;
            color: #2b3a30;
            border-radius: 0.25rem;
        }
        .btn-back:hover {
            background-color: #e6c984;
        }
        .container {
            padding-top: 2rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">Papelera: <span th:text="${entityType}"></span></h2>

    <div th:if="${#lists.isEmpty(deletedItems)}">
        <p>No hay elementos eliminados para esta entidad.</p>
    </div>

    <table class="table table-striped" th:if="${!#lists.isEmpty(deletedItems)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre / Título</th>
                <th>Fecha Eliminación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${deletedItems}">
                <td th:text="${item.id}">1</td>

                <!-- Mostrar 'name' o 'title' según la entidad -->
                <td th:text="${item.name != null ? item.name : (item.title != null ? item.title : '-')}">Nombre</td>

                <!-- Mostrar fecha de eliminación si existe -->
                <td th:text="${item.deletedAt != null ? #dates.format(item.deletedAt, 'dd/MM/yyyy') : '-'}">01/01/2025</td>

                <td>
                    <form th:action="@{'/trash/' + ${entityType} + '/' + ${item.id} + '/restore'}" method="post">
                        <button type="submit" class="btn btn-restore btn-sm">Restaurar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-back mt-3">Volver al Inicio</a>
</div>
</body>
</html>
