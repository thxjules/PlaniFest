<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Admin Report</title>
    <style type="text/css">
        body {
            color: #000;
            font-family: "Cormorant Garamond", serif;
            padding: 40px;
        }

        .report-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(210, 180, 140, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: #070707;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #02fb34;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #00373a;
            color: #ffffff;
            font-size: 1rem;
        }

        tr:nth-child(even) {
            background-color: #d4f1d7;
        }

        .value {
            font-weight: bold;
            color: #064040;
            text-align: right;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            text-align: center;
            color: #080808;
        }
    </style>
</head>
<body>
<img th:src="'data:image/png;base64,' + ${logoBase64}" alt="logo" style="width:120px;"/>
<div class="report-container">
    <h1>Reporte de Administración - PlaniFest</h1>
    <table>
        <thead>
        <tr>
            <th>Métrica</th>
            <th>Valor</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Total de empleados</td>
            <td class="value" th:text="${totalEmpleados}">0</td>
        </tr>
        <tr>
            <td>Total de eventos</td>
            <td class="value" th:text="${totalEventos}">0</td>
        </tr>
        <tr>
            <td>Total de tareas</td>
            <td class="value" th:text="${totalTareas}">0</td>
        </tr>
        <tr>
            <td>Tareas pendientes</td>
            <td class="value" th:text="${tareasPendientes}">0</td>
        </tr>
        <tr>
            <td>Total de suministros</td>
            <td class="value" th:text="${totalInsumos}">0</td>
        </tr>
        </tbody>
    </table>

    <div class="footer">
        Reporte generado automáticamente por el sistema el
        <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}">fecha</span>.
    </div>
</div>
</body>
</html>
