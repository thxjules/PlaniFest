<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Planifest</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9f6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .error-container {
            max-width: 600px;
            padding: 20px;
        }

        .error-img {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
            display: block;
        }

        .error-text p {
            font-size: 20px;
            color: #2c0a42;
            margin: 10px 0;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #b274f4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #492db9;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="/images/errores/500.png" alt="Error 500" class="error-img">
        <div class="error-text">
            <p>¡Boom! Algo explotó en la cocina del servidor.</p>
            <p>Estamos limpiando el desastre con delicadeza y amor</p>
            <a th:href="@{/index}" class="btn-back">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
