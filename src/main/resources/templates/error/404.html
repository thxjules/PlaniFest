<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Planifest</title>
    <style>
        * {
            background-color: #eeeeee;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
        }

        .error {
            background: url('/images/errores/404.png') no-repeat center center;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .error-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            height: 300px;  
        }

        .error-content p {
            font-size: 20px;
            color: #986edb;
            margin-bottom: 15px;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #b274f4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #492db9;
        }
    </style>
</head>

<body>
    <div class="error">
        <div class="error-content">
            <p>Oops... Esta página se fue de fiesta y no nos avisó</p>
            <p>¿Volvemos al inicio antes de que se acabe el ponqué?</p>
            <a th:href="@{/index}" class="btn-back">Volver al inicio</a>
        </div>
    </div>
</body>

</html>
