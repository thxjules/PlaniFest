<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil del Empleado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">

    <style>

        /* === FONDO GENERAL === */
        body {
            background-color: #fdfdf5f1;
            min-height: 100vh;
            margin: 0;
            color: #142b21;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* === ENCABEZADO CON LOGO === */
        .header-perfil {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .header-perfil img {
            width: 55px;
            height: 55px;
            border-radius: 8px;
        }

        .header-perfil h2 {
            font-weight: bold;
            margin: 0;
        }

        /* === CARDS TRANSPARENTES === */
        .card.custom-card {
            background-color: #faeecb87;
            border-radius: 12px;
            box-shadow: 0 6px 15px #00000040;
            backdrop-filter: blur(6px);
            border: none;
        }

        /* === BOTONES === */
        .btn-golden {
            background-color: #e7d2b7 !important;
            border-color: #9F6920 !important;
            color: #000000 !important;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-golden:hover {
            background-color: #e7d2b7 !important;
            color: #00000040;
            border-color: #dbc19e !important;
            transform: scale(1.05);
        }

        /* Botones secundarios */
        .btn-secondary {
            background-color: #06312a !important;
            border-color: #0d3d2d !important;
            color: white !important;
            font-weight: bold;
        }

        .btn-secondary:hover {
            transform: scale(1.05);
            background-color: #6e7d66 !important;
        }

        .form-label {
            color: #0c5840;
            font-weight: bold;
        }

        input.form-control {
            background-color: rgba(255,255,255,0.85);
            border: 1px solid #DAA755;
        }

    </style>
</head>

<body class="container py-5">

    <!-- ENCABEZADO CON LOGO -->
    <div class="header-perfil">
        <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest">
        <h2>Perfil del Empleado</h2>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <!-- Formulario en modo edición -->
    <form th:if="${editMode}" th:action="@{/employee-profile/update}" th:object="${empleado}"
          method="post" class="card custom-card p-4">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{username}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" th:field="*{email}" class="form-control"/>
        </div>

        <!-- Datos de solo lectura -->
        <div class="mb-3">
            <label class="form-label">Cargo</label>
            <input type="text" th:value="${empleado.position?.name}" class="form-control" readonly/>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <input type="text" th:value="${empleado.role}" class="form-control" readonly/>
        </div>

        <button type="submit" class="btn btn-golden">Guardar</button>
        <a th:href="@{/employee-profile}" class="btn btn-secondary">Cancelar</a>
    </form>

    <!-- Vista sin edición -->
    <div th:if="${!editMode}" class="card custom-card p-4">

        <p><strong class="color-golden">Nombre:</strong> <span th:text="${empleado.username}"></span></p>
        <p><strong class="color-golden">Teléfono:</strong> <span th:text="${empleado.phoneNumber}"></span></p>
        <p><strong class="color-golden">Correo:</strong> <span th:text="${empleado.email}"></span></p>
        <p><strong class="color-golden">Cargo:</strong> <span th:text="${empleado.position?.name}"></span></p>
        <p><strong class="color-golden">Rol:</strong> <span th:text="${empleado.role}"></span></p>

        <a th:href="@{/employee-profile/edit}" class="btn btn-golden">Editar Perfil</a> <br>
        <a th:href="@{/dashboard/empleado}" class="btn btn-secondary">Volver al Dashboard</a>
    </div>

</body>
</html>
