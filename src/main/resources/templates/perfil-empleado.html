<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil del Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon"  th:href="@{/images/planifest.png}" type="image/png">

</head>
<body class="container py-5">

    <h2 class="mb-4">Perfil del Empleado</h2>

    <!-- Mensajes -->
    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <!-- Formulario (solo edición) -->
    <form th:if="${editMode}" th:action="@{/employee-profile/update}" th:object="${empleado}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{username}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" th:field="*{email}" class="form-control"/>
        </div>

        <!-- Cargo y Rol: solo lectura -->
        <div class="mb-3">
            <label class="form-label">Cargo</label>
            <input type="text" th:value="${empleado.position?.name}" class="form-control" readonly/>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <input type="text" th:value="${empleado.role}" class="form-control" readonly/>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/employee-profile}" class="btn btn-secondary">Cancelar</a>
    </form>

    <!-- Vista de solo lectura -->
    <div th:if="${!editMode}" class="card p-4 shadow-sm">
        <p><strong>Nombre:</strong> <span th:text="${empleado.username}"></span></p>
        <p><strong>Teléfono:</strong> <span th:text="${empleado.phoneNumber}"></span></p>
        <p><strong>Correo:</strong> <span th:text="${empleado.email}"></span></p>
        <p><strong>Cargo:</strong> <span th:text="${empleado.position?.name}"></span></p>
        <p><strong>Rol:</strong> <span th:text="${empleado.role}"></span></p>

        <a th:href="@{/employee-profile/edit}" class="btn btn-primary">Editar Perfil</a>
        <a th:href="@{/dashboard/empleado}" class="btn btn-secondary">Volver al Dashboard</a>
    </div>

</body>
</html>
