<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifest - Lista de Tareas</title>
    <link rel="stylesheet" th:href="@{/css/tasks.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container py-5">

    <!-- MENSAJES DE ALERTA -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- ENCABEZADO -->
    <div class="header-section mb-4 text-center">
        <img th:src="@{/images/planifest.png}" alt="Logo Planifest" style="max-height: 200px;">
        <h1 class="mb-0">📝 Gestión de Tareas</h1>
        <p class="mt-2">Crea y organiza tareas para tus eventos</p>
    </div>

    <!-- BOTONES ENCIMA DE LA TABLA -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/dashboard/admin" class="btn btn-outline-secondary btn-planifest">🏠 Volver</a>
        <button class="btn btn-outline-primary btn-planifest"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#formularioTarea"
                aria-expanded="false"
                aria-controls="formularioTarea">
            ➕ Nueva tarea
        </button>
    </div>
    <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-success text-white">
        <h5 class="mb-0"><i class="bi bi-file-earmark-excel-fill"></i> Importar tareas desde Excel</h5>
    </div>
    <div class="card-body">
        <form th:action="@{/tasks-view/import-excel}" method="post" enctype="multipart/form-data" class="d-flex align-items-center gap-3">
            <div class="flex-grow-1">
                <input class="form-control" type="file" id="file" name="file" accept=".xls,.xlsx" required>
            </div>
            <button type="submit" class="btn btn-success">
                <i class="bi bi-upload"></i> Importar
            </button>
        </form>
    </div>
</div>
</form>

    <!-- FORMULARIO DE TAREA -->
    <div th:class="${task.id != null} ? 'collapse show' : 'collapse'" id="formularioTarea">
        <div class="card shadow-sm border-0 mb-4 fondo-transparente">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="${task.id != null} ? 'Editar Tarea' : 'Nueva Tarea'">Formulario de Tarea</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/tasks-view/save}" method="post" th:object="${task}">
                    <input type="hidden" th:field="*{id}" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{name}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Usuario asignado</label>
                            <select th:field="*{user.id}" class="form-select">
                                <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.username}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Evento</label>
                            <select th:field="*{event.id}" class="form-select" id="evento-select">
                                <option th:each="evento : ${eventos}" th:value="${evento.id}" th:text="${evento.eventName}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha del Evento</label>
                            <input type="text" id="fecha-evento" class="form-control" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ubicación del Evento</label>
                            <input type="text" id="ubicacion-evento" class="form-control" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="PENDING">Pendiente</option>
                                <option value="COMPLETED">Completado</option>
                                <option value="IN_PROGRESS">En Progreso</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha y hora de la tarea</label>
                            <input type="datetime-local" th:field="*{date}" class="form-control" required />
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success">
                            <span th:text="${task.id != null} ? '🔄 Actualizar tarea' : '💾 Guardar tarea'">💾 Guardar tarea</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FILTRO DE BÚSQUEDA -->
    <form method="get" th:action="@{/tasks-view}" class="mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label for="fechaTarea" class="form-label">Fecha de la tarea</label>
                <input type="date" class="form-control" id="fechaTarea" name="fechaTarea" th:value="${fechaTarea}">
            </div>
            <div class="col-md-2">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" id="estado" name="estado">
                    <option value="">Todos</option>
                    <option value="PENDING" th:selected="${estado == 'PENDING'}">Pendiente</option>
                    <option value="IN_PROGRESS" th:selected="${estado == 'IN_PROGRESS'}">En progreso</option>
                    <option value="COMPLETED" th:selected="${estado == 'COMPLETED'}">Completado</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="form-control" th:value="${nombre}">
            </div>
            <div class="col-md-2">
                <label for="usuario" class="form-label">Usuario</label>
                <select class="form-select" id="usuario" name="usuarioId">
                    <option value="">Todos</option>
                    <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.username}"
                            th:selected="${usuario.id == usuarioId}"></option>
                </select>
            </div>
            <div class="col-md-2 filtro-botones">
                <button type="submit" class="btn btn-custom-primary btn-planifest">🔍 Filtrar</button>
                <a href="/tasks-view" class="btn btn-custom-secondary btn-planifest">♻ Limpiar</a>
            </div>
        </div>
    </form>

    <!-- TABLA DE TAREAS -->
    <div class="card shadow-sm border-0 fondo-transparente">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">📋 Lista de Tareas</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Usuario</th>
                            <th>Evento</th>
                            <th>Ubicación</th> <!-- Nueva columna -->
                            <th>Fecha del Evento</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${tareas}">
                            <td th:text="${t.name}"></td>
                            <td th:text="${t.description}"></td>
                            <td th:text="${t.user.username}"></td>
                            <td th:text="${t.event.eventName}"></td>
                            <td th:text="${t.event.location} ?: 'Sin ubicación'"></td> <!-- Ubicación -->
                            <td th:text="${#temporals.format(t.event.date, 'dd/MM/yyyy')}"></td>
                            <td>
                                <span th:classappend="${t.status == 'COMPLETED'} ? 'badge bg-success' : 'badge bg-warning text-dark'"
                                      th:text="${t.status}"></span>
                            </td>
                            <td th:text="${#temporals.format(t.date, 'dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(t.date, 'HH:mm')}"></td>
                            <td class="text-center">
                                <a th:href="@{/tasks-view(id=${t.id})}" class="btn btn-sm btn-outline-primary me-1">✏️</a>
                                <a th:href="@{/tasks-view/delete/{id}(id=${t.id})}" class="btn btn-sm btn-outline-danger">🗑</a>
                            </td>
                        </tr>
                        <tr th:if="${tareas.size() == 0}">
                            <td colspan="10" class="text-center text-muted">No hay tareas registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPT para mostrar fecha y ubicación del evento -->
<script th:inline="javascript">
    const eventos = /*[[${eventos}]]*/ [];
    const fechasEvento = {};
    const ubicacionesEvento = {};
    
    eventos.forEach(e => {
        fechasEvento[e.id] = e.date;
        ubicacionesEvento[e.id] = e.location;
    });

    const selectEvento = document.getElementById('evento-select');
    const inputFechaEvento = document.getElementById('fecha-evento');
    const inputUbicacionEvento = document.getElementById('ubicacion-evento');

    selectEvento.addEventListener('change', function () {
        const id = this.value;
        inputFechaEvento.value = fechasEvento[id] || '';
        inputUbicacionEvento.value = ubicacionesEvento[id] || '';
    });

    window.addEventListener('DOMContentLoaded', () => {
        const id = selectEvento.value;
        inputFechaEvento.value = fechasEvento[id] || '';
        inputUbicacionEvento.value = ubicacionesEvento[id] || '';
    });
</script>

<!-- SCRIPT para ocultar alertas después de 5 segundos -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const alerts = document.querySelectorAll('.alert');
        setTimeout(() => {
            alerts.forEach(alert => {
                alert.classList.remove('show');
                alert.classList.add('fade');
            });
        }, 5000);
    });
</script>

</body>
</html>
