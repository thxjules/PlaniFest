<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Planifest - Gestión de Tareas</title>
    <link rel="stylesheet" th:href="@{/css/tasks.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">
</head>

<body>
    <div class="container py-5">

        <!-- ENCABEZADO CON LOGO -->
        <div class="header-section text-center">
            <div class="text-section">
                <h1 class="mb-0">Gestión de Tareas</h1>
                <p class="mt-2">Crea y organiza tareas para tus eventos</p>
            </div>
            <div class="logo">
                <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest">
            </div>
        </div>

        <!-- MENSAJES DE ÉXITO / ERROR -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- BOTONES ENCIMA DE LA TABLA -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/dashboard/admin" class="btn btn-outline-secondary btn-sm"> Volver</a>
            <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse"
                data-bs-target="#formularioTarea" aria-expanded="false" aria-controls="formularioTarea">
                Nueva tarea
            </button>
        </div>


        <!-- IMPORTAR TAREAS (CSV/Excel) -->
        <form th:action="@{/tasks-view/import-tasks}" method="post" enctype="multipart/form-data" class="mb-4">
            <div class="mb-3">
                <label for="file" class="form-label">Importar tareas desde Excel/CSV</label>
                <input class="form-control" type="file" name="file" id="file" required>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            </div>
            <button type="submit" class="btn btn-success"> Importar</button>
        </form>

        <!-- FORMULARIO DE TAREA EXPANDIBLE -->
        <div class="collapse" id="formularioTarea" th:classappend="${task.id != null} ? ' show' : ''">
            <div class="card shadow-sm border-0 mb-4 fondo-transparente">
                <div class="card-header nueva-tarea">
                    <h5 class="mb-0" th:text="${task.id == null} ? 'Nueva Tarea' : 'Editar Tarea'">Formulario de Tarea
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/tasks-view/save}" method="post" th:object="${task}">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" th:field="*{name}" class="form-control" required />
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Usuario asignado</label>
                                <select th:field="*{user.id}" class="form-select" required>
                                    <option value="">-- Selecciona un usuario --</option>
                                    <option th:each="usuario : ${usuarios}" th:value="${usuario.id}"
                                        th:text="${usuario.username}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Evento</label>
                                <select th:field="*{event.id}" class="form-select" id="eventoSelect" required>
                                    <option value="">-- Selecciona un evento --</option>
                                    <option th:each="evento : ${eventos}" th:value="${evento.id}"
                                        th:data-fecha="${#temporals.format(evento.date, 'dd/MM/yyyy')}"
                                        th:text="${evento.eventName}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Fecha del Evento</label>
                                <input type="text" id="fechaEvento"
                                    th:value="${task.event != null ? #temporals.format(task.event.date, 'dd/MM/yyyy') : ''}"
                                    class="form-control" readonly />
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Estado</label>
                                <select th:field="*{status}" class="form-select" required>
                                    <option value="PENDING">Pendiente</option>
                                    <option value="COMPLETED">Completado</option>
                                    <option value="IN_PROGRESS">En Progreso</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Fecha de la tarea</label>
                                <input type="datetime-local" th:field="*{date}" class="form-control" required />
                            </div>

                            <div class="col-12">
                                <label class="form-label">Descripción</label>
                                <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-success">
                                <span th:text="${task.id == null} ? ' Guardar tarea' : 'Actualizar tarea'"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- FILTROS -->
        <form th:action="@{/tasks-view}" method="get" class="row g-2 mb-3 align-items-end">
            <div class="col-12 col-sm-6 col-md-3">
                <input type="text" name="nombre" th:value="${nombre}" class="form-control"
                    placeholder="Nombre de la tarea">
            </div>
            <div class="col-12 col-sm-6 col-md-2">
                <select name="estado" class="form-select">
                    <option value="">-- Estado --</option>
                    <option value="PENDING" th:selected="${estado == 'PENDING'}">Pendiente</option>
                    <option value="IN_PROGRESS" th:selected="${estado == 'IN_PROGRESS'}">En Progreso</option>
                    <option value="COMPLETED" th:selected="${estado == 'COMPLETED'}">Completado</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <input type="date" name="fechaTarea" th:value="${fechaTarea}" class="form-control">
            </div>
            <div class="col-12 col-sm-6 col-md-2">
                <select name="usuarioId" class="form-select">
                    <option value="">-- Usuario --</option>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.username}"
                        th:selected="${usuarioId == u.id}"></option>
                </select>
            </div>
            <div class="col-12 col-sm-12 col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-lg w-100"> Buscar</button>
                <button type="button" class="btn btn-success btn-lg w-100" onclick="limpiarFiltros()"> Limpiar</button>
            </div>
        </form>

        <!-- TABLA DE TAREAS -->
        <div class="card shadow-sm border-0 fondo-transparente">
            <div class="card-header lista-tareas">
                <h5 class="mb-0"> Lista de Tareas</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Usuario</th>
                                <th>Evento</th>
                                <th>Estado</th>
                                <th>Fecha Evento</th>
                                <th>Fecha Tarea</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${tareas}">
                                <td th:text="${t.name}"></td>
                                <td th:text="${t.description}"></td>
                                <td th:text="${t.user.username}"></td>
                                <td th:text="${t.event.eventName}"></td>
                                <td>
                                    <span
                                        th:classappend="${t.status == 'COMPLETED'} ? 'badge bg-success' : 'badge bg-warning text-dark'"
                                        th:text="${t.status}"></span>
                                </td>
                                <td th:text="${#temporals.format(t.event.date, 'dd/MM/yyyy')}"></td>
                                <td th:text="${#temporals.format(t.date, 'dd/MM/yyyy')}"></td>
                                <td class="text-center">
                                    <a th:href="@{/tasks-view(id=${t.id})}"
                                        class="btn btn-sm btn-outline-primary me-1">Editar</a>
                                    <button type="button" class="btn btn-sm btn-eliminar" th:data-id="${t.id}"
                                        th:data-nombre="${t.name}">
                                        Eliminar
                                    </button>


                            </tr>
                            <tr th:if="${tareas.size() == 0}">
                                <td colspan="8" class="text-center text-muted">No hay tareas registradas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        function limpiarFiltros() {
            document.querySelector('input[name="nombre"]').value = '';
            document.querySelector('select[name="estado"]').selectedIndex = 0;
            document.querySelector('input[name="fechaTarea"]').value = '';
            document.querySelector('select[name="usuarioId"]').selectedIndex = 0;
            window.location.href = "/tasks-view";
        }

        document.addEventListener("DOMContentLoaded", function () {
            const eventoSelect = document.getElementById("eventoSelect");
            const fechaEvento = document.getElementById("fechaEvento");
            if (eventoSelect) {
                eventoSelect.addEventListener("change", function () {
                    let fecha = this.options[this.selectedIndex].getAttribute("data-fecha");
                    fechaEvento.value = fecha || "";
                });
            }
        });
    </script>
    ...
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            document.querySelectorAll(".btn-eliminar").forEach(btn => {

                btn.addEventListener("click", () => {

                    const taskId = btn.getAttribute("data-id");
                    const taskName = btn.getAttribute("data-nombre");

                    Swal.fire({
                        title: `¿Eliminar la tarea "${taskName}"?`,
                        text: "Esta acción no se puede deshacer.",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: "#d33",
                        cancelButtonColor: "#3085d6",
                        confirmButtonText: "Sí, eliminar",
                        cancelButtonText: "Cancelar"
                    }).then(result => {
                        if (result.isConfirmed) {
                            window.location.href = `/tasks-view/delete/${taskId}`;
                        }
                    });

                });

            });

        });
    </script>


</body>

</html>
