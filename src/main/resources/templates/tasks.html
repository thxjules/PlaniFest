<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifest - Lista de Tareas</title>
    <link rel="stylesheet" th:href="@{/css/tasks.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container py-5">

    <!-- ENCABEZADO -->
    <div class="header-section mb-4 text-center">
        <img th:src="@{/images/planifest.png}" alt="Logo Planifest" style="max-height: 200px;">
        <h1 class="mb-0">📝 Gestión de Tareas</h1>
        <p class="mt-2">Crea y organiza tareas para tus eventos</p>
    </div>

    <!-- BOTONES ENCIMA DE LA TABLA -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/dashboard/admin.html" class="btn btn-outline-secondary btn-sm">🏠 Volver</a>
        <button class="btn btn-outline-primary btn-sm"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#formularioTarea"
                aria-expanded="false"
                aria-controls="formularioTarea">
            ➕ Nueva tarea
        </button>
    </div>

    <!-- FORMULARIO DE TAREA -->
    <div th:class="${task.id != null} ? 'collapse show' : 'collapse'" id="formularioTarea">
        <div class="card shadow-sm border-0 mb-4 fondo-transparente">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="${task.id != null} ? 'Editar Tarea' : 'Nueva Tarea'">Formulario de Tarea</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/tasks-view/save}" method="post" th:object="${task}">
                    <input type="hidden" th:field="*{id}" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{name}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Usuario asignado</label>
                            <select th:field="*{user.id}" class="form-select">
                                <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.username}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Evento</label>
                            <select th:field="*{event.id}" class="form-select">
                                <option th:each="evento : ${eventos}" th:value="${evento.id}" th:text="${evento.eventName}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="PENDING">Pendiente</option>
                                <option value="COMPLETED">Completado</option>
                                <option value="IN_PROGRESS">En Progreso</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha</label>
                            <input type="date" th:field="*{date}" class="form-control" required />
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success">
                            <span th:text="${task.id != null} ? '🔄 Actualizar tarea' : '💾 Guardar tarea'">💾 Guardar tarea</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TABLA DE TAREAS -->
    <div class="card shadow-sm border-0 fondo-transparente">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">📋 Lista de Tareas</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Usuario</th>
                            <th>Evento</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${tareas}">
                            <td th:text="${t.name}"></td>
                            <td th:text="${t.description}"></td>
                            <td th:text="${t.user.username}"></td>
                            <td th:text="${t.event.eventName}"></td>
                            <td>
                                <span th:classappend="${t.status == 'COMPLETED'} ? 'badge bg-success' : 'badge bg-warning text-dark'" th:text="${t.status}"></span>
                            </td>
                            <td th:text="${t.date}"></td>
                            <td class="text-center">
                                <a th:href="@{/tasks-view(id=${t.id})}" class="btn btn-sm btn-outline-primary me-1">✏️</a>
                                <a th:href="@{/tasks-view/delete/{id}(id=${t.id})}" class="btn btn-sm btn-outline-danger">🗑</a>
                            </td>
                        </tr>
                        <tr th:if="${tareas.size() == 0}">
                            <td colspan="7" class="text-center text-muted">No hay tareas registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
