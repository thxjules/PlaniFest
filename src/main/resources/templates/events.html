<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifest - Gestión de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/events.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container py-5">

    <!-- ENCABEZADO -->
    <div class="header-section mb-4 text-center">
        <img src="/images/planifest.png" alt="Logo Planifest" style="max-height: 200px;">
        <h1 class="mb-0">📅 Gestión de Eventos</h1>
        <p class="mt-2">Crea y organiza los eventos</p>
    </div>

    <!-- MENSAJES DE ALERTA -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- BOTONES ENCIMA DEL FORMULARIO -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/dashboard/admin}" class="btn btn-outline-secondary btn-sm">
            <i class="bx bx-home"></i> Volver
        </a>
        <button class="btn btn-outline-primary btn-sm"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#formularioEvento"
                aria-expanded="false"
                aria-controls="formularioEvento">
            <span th:text="${event.id != null} ? '✏ Editar evento' : '➕ Nuevo evento'">➕ Nuevo evento</span>
        </button>
    </div>

    <!-- FORMULARIO EVENTO -->
    <div th:class="${event.id != null} ? 'collapse show' : 'collapse'" id="formularioEvento">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="${event.id != null} ? 'Editar Evento' : 'Nuevo Evento'">Formulario de Evento</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/events-view/save}" method="post" th:object="${event}">
                    <input type="hidden" th:field="*{id}" />
                    <div class="row g-3">
                        <!-- Datos básicos -->
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{eventName}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cliente</label>
                            <select th:field="*{client.id}" class="form-select" required>
                                <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha</label>
                            <input type="date" th:field="*{date}" class="form-control" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora inicio</label>
                            <input type="time" th:field="*{startTime}" class="form-control" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora fin</label>
                            <input type="time" th:field="*{endTime}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Número de invitados</label>
                            <input type="number" th:field="*{guestCount}" class="form-control" required />
                        </div>

                        <!-- Ubicación y mapa -->
                        <div class="col-md-6">
                            <label class="form-label">Ubicación</label>
                            <input type="text" th:field="*{location}" class="form-control" required />
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Mapa de ubicación</label>
                            <div id="mapContainer" style="width: 100%; height: 300px; border: 1px solid #ccc;">
                                <iframe id="mapFrame" th:src="${mapUrl}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                            </div>
                        </div>

                        <!-- Estado -->
                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <select th:field="*{status}" class="form-select" required>
                                <option th:each="estado : ${T(com.example.planifest.enums.EventStatus).values()}"
                                        th:value="${estado}"
                                        th:selected="${estado} == ${event.status}"
                                        th:text="${estado == T(com.example.planifest.enums.EventStatus).ACTIVE ? 'Activo' : 'Inactivo'}">
                                </option>
                            </select>
                        </div>

                        <!-- Suministros -->
                        <div class="col-md-12 mb-2">
                            <button type="button" class="btn btn-outline-success" id="addSupplyBtn">
                                ➕ Nuevo suministro
                            </button>
                        </div>
                        <div id="suministrosContainer"></div>

                    </div>

                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success">
                            <span th:text="${event.id != null} ? '🔄 Actualizar evento' : '💾 Guardar evento'">💾 Guardar evento</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TABLA DE EVENTOS -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">📋 Lista de Eventos</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Cliente</th>
                            <th>Ubicación</th>
                            <th>Fecha</th>
                            <th>Horario</th>
                            <th>Invitados</th>
                            <th>Estado</th>
                            <th>Suministros</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${eventos}">
                            <td th:text="${e.eventName}"></td>
                            <td th:text="${e.client.name}"></td>
                            <td th:text="${e.location}"></td>
                            <td th:text="${e.date}"></td>
                            <td th:text="${e.startTime + ' - ' + e.endTime}"></td>
                            <td th:text="${e.guestCount}"></td>
                            <td>
                                <span th:classappend="${e.status} == 'ACTIVE' ? 'badge bg-info text-dark' : 'badge bg-warning text-dark'" th:text="${e.status}"></span>
                            </td>
                            <td>
                                
                                <ul class="mb-0 ps-3">
                                     <li th:each="es : ${e.eventSupplies}" 
                                        th:text="${es.supply.name + ' (' + es.quantitySupply + ')'}"></li>
                                </ul>
                            
                            </td>
                            <td class="text-center">
                                <a th:href="@{/events-view(id=${e.id})}" class="btn btn-sm btn-outline-primary me-1">✏</a>
                                <a th:href="@{/events-view/delete/{id}(id=${e.id})}" class="btn btn-sm btn-outline-danger">🗑</a>
                            </td>
                        </tr>
                        <tr th:if="${eventos.size() == 0}">
                            <td colspan="9" class="text-center text-muted">No hay eventos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Template de Suministros -->
  <template id="supplyTemplate">
    <div class="row mb-2 supply-entry">
        <div class="col-md-6">
            <label class="form-label">Suministro</label>
            <select name="eventSupplies[__INDEX__].supply.id" class="form-select" required>
                <option value="">-- Selecciona --</option>
                <option th:each="s : ${suministros}" th:value="${s.id}" th:text="${s.name}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Cantidad</label>
            <input type="number" name="eventSupplies[__INDEX__].quantitySupply" class="form-control" min="1" required />
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-danger removeSupplyBtn">🗑</button>
        </div>
    </div>
</template>
</div>

<!-- Los Scripts -->
<script>
        
    // Suministros un poquito más dinámicos
    let supplyIndex = 0;
    document.getElementById('addSupplyBtn').addEventListener('click', () => {
        const template = document.getElementById('supplyTemplate').innerHTML;
        const newSupply = template.replace(/INDEX/g, supplyIndex);
        supplyIndex++;

        const container = document.getElementById('suministrosContainer');
        container.insertAdjacentHTML('beforeend', newSupply);

        container.querySelectorAll('.removeSupplyBtn').forEach(btn => {
            btn.onclick = (e) => e.target.closest('.supply-entry').remove();
        });
    });

    // Actualizar mapa de forma dinámica
    const locationInput = document.querySelector('input[th\\:field="*{location}"]');
    const mapFrame = document.getElementById('mapFrame');

    locationInput.addEventListener('input', () => {
        const address = locationInput.value.trim();
        if (address.length > 3) {
            mapFrame.src = `https://www.google.com/maps/embed/v1/place?key=AIzaSyCgZPwudO2MG358I1CqrzctaVrIfclADcQ&q=${encodeURIComponent(address)}`;
        }
    });
</script>
</body>
</html>
