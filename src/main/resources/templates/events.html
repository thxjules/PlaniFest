<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Planifest - Gestión de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/events.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">
</head>

<body>
    <div class="container py-5">

        <!-- Header -->
        <div class="header-section mb-4 d-flex align-items-center justify-content-center">
            <div class="text-section me-3">
                <h1 class="mb-0">Gestión de Eventos</h1>
                <p class="mt-2">Crea y organiza los eventos</p>
            </div>
            <div class="logo">
                <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest" height="100" width="100">
            </div>
        </div>

        <!-- Mensajes de alerta -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Botones de acción -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a th:href="@{/dashboard/admin}" class="btn btn-outline-secondary btn-sm">
                <i class="bx bx-home"></i> Volver
            </a>
            <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse"
                data-bs-target="#formularioEvento" aria-expanded="false" aria-controls="formularioEvento">
                <span th:text="${event.id != null} ? 'Editar evento' : 'Nuevo evento'">Nuevo evento</span>
            </button>
        </div>

        <!-- Formulario de Evento -->
        <div th:class="${event.id != null} ? 'collapse show' : 'collapse'" id="formularioEvento">
            <div class="card shadow-sm border-0 fondo-transparente mb-4">
                <div class="card-header nuevo-evento">
                    <h5 class="mb-0" th:text="${event.id != null} ? 'Editar Evento' : 'Nuevo Evento'">Formulario de Evento</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/events-view/save}" method="post" th:object="${event}">
                        <input type="hidden" th:field="*{id}" />
                        <div class="row g-3">
                            <!-- Nombre y Cliente -->
                            <div class="col-md-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" th:field="*{eventName}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cliente</label>
                                <select th:field="*{client.id}" class="form-select" required>
                                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                                        th:text="${cliente.name}"></option>
                                </select>
                            </div>

                            <!-- Descripción -->
                            <div class="col-md-12">
                                <label class="form-label">Descripción</label>
                                <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                            </div>

                            <!-- Fecha y Hora -->
                            <div class="col-md-4">
                                <label class="form-label">Fecha</label>
                                <input type="date" th:field="*{date}" class="form-control" required />
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Hora inicio</label>
                                <input type="time" th:field="*{startTime}" class="form-control" required />
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Hora fin</label>
                                <input type="time" th:field="*{endTime}" class="form-control" required />
                            </div>

                            <!-- Invitados y Ubicación -->
                            <div class="col-md-6">
                                <label class="form-label">Número de invitados</label>
                                <input type="number" th:field="*{guestCount}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ubicación</label>
                                <input id="location" type="text" th:field="*{location}" class="form-control" required />
                            </div>

                            <!-- Mapa -->
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Mapa de ubicación</label>
                                <div id="mapContainer" style="width:100%; height:300px; border:1px solid #ccc;">
                                    <iframe id="mapFrame"
                                        th:src="${mapUrl != null ? mapUrl : 'https://www.google.com/maps/embed/v1/place?key=AIzaSyDWLM8nzHgCHy6QLiGnuDcNAQf8SJAVPwY&q=Colombia'}"
                                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                                    </iframe>
                                </div>
                            </div>

                            <!-- Estado y Servicios -->
                            <div class="col-md-6">
                                <label class="form-label">Estado</label>
                                <select th:field="*{status}" class="form-select" required>
                                    <option th:each="estado : ${T(com.example.planifest.enums.EventStatus).values()}"
                                        th:value="${estado}" th:selected="${estado} == ${event.status}"
                                        th:text="${estado == T(com.example.planifest.enums.EventStatus).ACTIVE ? 'Activo' : 'Inactivo'}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Servicios (opcional)</label>
                                <select th:field="*{planiServices}" multiple size="5" class="form-select">
                                    <option th:each="service : ${allservicios}" th:value="${service.serviceId}"
                                        th:text="${service.name}"
                                        th:selected="${event.planiServices != null} ? ${event.planiServices.contains(service)} : false">
                                    </option>
                                </select>
                            </div>

                            <!-- Suministros -->
                            <div class="col-md-12 mb-2">
                                <button type="button" class="btn btn-outline-success" id="addSupplyBtn">
                                    ➕ Nuevo suministro
                                </button>
                                <input type="hidden" id="initialSupplyCount"
                                    th:value="${event.eventSupplies != null ? event.eventSupplies.size() : 0}" />
                                <div id="suministrosContainer">
                                    <div th:if="${event.eventSupplies != null}"
                                        th:each="es,iterStat : ${event.eventSupplies}" class="row mb-2 supply-entry">
                                        <input type="hidden" th:name="${'eventSupplies[' + iterStat.index + '].id'}"
                                            th:value="${es.id}" />
                                        <div class="col-md-6">
                                            <label class="form-label">Suministro</label>
                                            <select th:name="${'eventSupplies[' + iterStat.index + '].supply.id'}"
                                                class="form-select" required>
                                                <option value="">-- Selecciona --</option>
                                                <option th:each="s : ${suministros}" th:value="${s.id}"
                                                    th:text="${s.name}" th:selected="${s.id} == ${es.supply.id}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Cantidad</label>
                                            <input type="number"
                                                th:name="${'eventSupplies[' + iterStat.index + '].quantitySupply'}"
                                                class="form-control" min="1" required th:value="${es.quantitySupply}" />
                                        </div>
                                        <div class="col-md-2 d-flex align-items-end">
                                            <button type="button" class="btn btn-danger removeSupplyBtn">🗑</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-success">
                                <span th:text="${event.id != null} ? 'Actualizar evento' : 'Guardar evento'">
                                    Guardar evento
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabla de Eventos -->
        <div class="card shadow-sm border-0">
            <div class="card-header lista-eventos">
                <h5 class="mb-0">Lista de Eventos</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-header-custom">
                            <tr>
                                <th>Nombre</th>
                                <th>Cliente</th>
                                <th>Ubicación</th>
                                <th>Fecha</th>
                                <th>Horario</th>
                                <th>Invitados</th>
                                <th>Estado</th>
                                <th>Suministros</th>
                                <th>Servicios</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${eventos}">
                                <td th:text="${e.eventName}"></td>
                                <td th:text="${e.client.name}"></td>
                                <td th:text="${e.location}"></td>
                                <td th:text="${e.date}"></td>
                                <td th:text="${e.startTime + ' - ' + e.endTime}"></td>
                                <td th:text="${e.guestCount}"></td>
                                <td>
                                    <span th:classappend="${e.status} == 'ACTIVE' ? 'badge bg-info text-dark' : 'badge bg-warning text-dark'"
                                        th:text="${e.status}"></span>
                                </td>
                                <td>
                                    <ul class="mb-0 ps-3">
                                        <li th:each="es : ${e.eventSupplies}"
                                            th:text="${es.supply.name + ' (x' + es.quantitySupply + ')'}"></li>
                                    </ul>
                                </td>
                                <td>
                                    <ul class="mb-0 ps-3">
                                        <li th:each="s : ${e.planiServices}" th:text="${s.name}"></li>
                                    </ul>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/events-view(id=${e.id})}" class="btn btn-sm btn-edit action-btn">Editar</a>
                                    <button type="button" class="btn btn-danger btn-sm btn-eliminar"
                                        th:data-id="${e.id}">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${eventos.size() == 0}">
                                <td colspan="10" class="text-center text-muted">No hay eventos registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Plantilla de suministro -->
    <template id="supplyTemplate">
        <div class="row mb-2 supply-entry">
            <div class="col-md-6">
                <label class="form-label">Suministro</label>
                <select name="eventSupplies[INDEX].supply.id" class="form-select" required>
                    <option value="">-- Selecciona --</option>
                    <option th:each="s : ${suministros}" th:value="${s.id}" th:text="${s.name}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Cantidad</label>
                <input type="number" name="eventSupplies[INDEX].quantitySupply" class="form-control" min="1" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="button" class="btn btn-danger removeSupplyBtn">🗑</button>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script>
        // Manejo de suministros
        document.addEventListener('DOMContentLoaded', () => {
            const initialCountEl = document.getElementById('initialSupplyCount');
            let supplyIndex = initialCountEl ? (parseInt(initialCountEl.value, 10) || 0) : 0;

            const addBtn = document.getElementById('addSupplyBtn');
            const container = document.getElementById('suministrosContainer');

            function attachRemoveHandlers() {
                document.querySelectorAll('.removeSupplyBtn').forEach(btn => {
                    if (!btn.dataset.hasHandler) {
                        btn.addEventListener('click', e => e.target.closest('.supply-entry').remove());
                        btn.dataset.hasHandler = '1';
                    }
                });
            }

            addBtn.addEventListener('click', () => {
                const template = document.getElementById('supplyTemplate').innerHTML;
                const newHtml = template.replace(/INDEX/g, supplyIndex);
                supplyIndex++;
                container.insertAdjacentHTML('beforeend', newHtml);
                attachRemoveHandlers();
            });

            attachRemoveHandlers();
        });

        // Manejo de mapa dinámico
        document.addEventListener("DOMContentLoaded", () => {
            const locationInput = document.getElementById('location');
            const mapFrame = document.getElementById('mapFrame');
            const apiKey = 'AIzaSyDWLM8nzHgCHy6QLiGnuDcNAQf8SJAVPwY'; // misma clave para todo

            if (!locationInput || !mapFrame) return;

            locationInput.addEventListener('input', () => {
                const address = locationInput.value.trim();
                if (address.length > 3) {
                    mapFrame.src =
                        `https://www.google.com/maps/embed/v1/place?key=${apiKey}&q=${encodeURIComponent(address)}`;
                }
            });
        });

        // SweetAlert para eliminar
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll('.btn-eliminar').forEach(btn => {
                btn.addEventListener('click', function () {
                    let id = this.getAttribute("data-id");

                    Swal.fire({
                        title: "¿Eliminar evento?",
                        text: "Esta acción no se puede deshacer.",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: "#d33",
                        cancelButtonColor: "#3085d6",
                        confirmButtonText: "Sí, eliminar",
                        cancelButtonText: "Cancelar"
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = `/events-view/delete/${id}`;
                        }
                    });
                });
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
