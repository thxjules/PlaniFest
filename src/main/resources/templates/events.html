<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifest - Gestión de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/events.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container py-5">

    <!-- ENCABEZADO -->
    <div class="header-section mb-4 text-center">
        <img src="/images/planifest.png" alt="Logo Planifest" style="max-height: 200px;">
        <h1 class="mb-0">📅 Gestión de Eventos</h1>
        <p class="mt-2">Crea y organiza los eventos</p>
    </div>

    <!-- BOTONES ENCIMA DEL FORMULARIO -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/dashboard/admin}" class="btn btn-outline-secondary btn-sm">
            <i class="bx bx-home"></i> Volver
        </a>
        <button class="btn btn-outline-primary btn-sm"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#formularioEvento"
                aria-expanded="false"
                aria-controls="formularioEvento">
            <span th:text="${event.id != null} ? '✏ Editar evento' : '➕ Nuevo evento'">➕ Nuevo evento</span>
        </button>
    </div>

    <!-- FILTROS -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">🔍 Filtros</h5>
        </div>
        <div class="card-body">
            <form method="get" th:action="@{/events-view}" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="nombre" class="form-label">Nombre del evento</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" th:value="${param.nombre}" placeholder="Ej. Boda, Fiesta..." />
                </div>
                <div class="col-md-3">
                    <label for="minGuests" class="form-label">Mínimo de invitados</label>
                    <input type="number" class="form-control" id="minGuests" name="minGuests" th:value="${param.minGuests}" />
                </div>
                <div class="col-md-3">
                    <label for="clientId" class="form-label">Cliente</label>
                    <select class="form-select" id="clientId" name="clientId">
                        <option value="" th:selected="${param.clientId == null}">Todos</option>
                        <option th:each="c : ${clientes}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${param.clientId} == ${c.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2 d-grid gap-2">
                    <button type="submit" class="btn btn-outline-primary">Aplicar filtros</button>
                    <a th:href="@{/events-view}" class="btn btn-outline-secondary">Limpiar filtros</a>
                </div>
            </form>
        </div>
    </div>

    <!-- FORMULARIO -->
    <div th:class="${event.id != null} ? 'collapse show' : 'collapse'" id="formularioEvento">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="${event.id != null} ? 'Editar Evento' : 'Nuevo Evento'">Formulario de Evento</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/events-view/save}" method="post" th:object="${event}">
                    <input type="hidden" th:field="*{id}" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{eventName}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cliente</label>
                            <select th:field="*{client.id}" class="form-select" required>
                                <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha</label>
                            <input type="date" th:field="*{date}" class="form-control" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora inicio</label>
                            <input type="time" th:field="*{startTime}" class="form-control" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora fin</label>
                            <input type="time" th:field="*{endTime}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Número de invitados</label>
                            <input type="number" th:field="*{guestCount}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ubicación</label>
                            <input type="text" th:field="*{location}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <select th:field="*{status}" class="form-select" required>
                                <option th:each="estado : ${T(com.example.planifest.enums.EventStatus).values()}"
                                        th:value="${estado}"
                                        th:selected="${estado} == ${event.status}"
                                        th:text="${estado == T(com.example.planifest.enums.EventStatus).ACTIVE ? 'Activo' : 'Inactivo'}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success">
                            <span th:text="${event.id != null} ? '🔄 Actualizar evento' : '💾 Guardar evento'">💾 Guardar evento</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TABLA DE EVENTOS -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">📋 Lista de Eventos</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Cliente</th>
                            <th>Ubicación</th>
                            <th>Fecha</th>
                            <th>Horario</th>
                            <th>Invitados</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${eventos}">
                            <td th:text="${e.eventName}"></td>
                            <td th:text="${e.client.name}"></td>
                            <td th:text="${e.location}"></td>
                            <td th:text="${e.date}"></td>
                            <td th:text="${e.startTime + ' - ' + e.endTime}"></td>
                            <td th:text="${e.guestCount}"></td>
                            <td>
                                <span th:classappend="${e.status} == 'ACTIVE' ? 'badge bg-info text-dark' : 'badge bg-warning text-dark'" th:text="${e.status}"></span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/events-view(id=${e.id})}" class="btn btn-sm btn-outline-primary me-1">✏</a>
                                <a th:href="@{/events-view/delete/{id}(id=${e.id})}" class="btn btn-sm btn-outline-danger">🗑</a>
                            </td>
                        </tr>
                        <tr th:if="${eventos.size() == 0}">
                            <td colspan="8" class="text-center text-muted">No hay eventos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
