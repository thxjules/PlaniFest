<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifest - Lista de Suministros</title>
    <link rel="stylesheet" th:href="@{/css/supply.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">
</head>
<body>

<div class="container py-5">
    <div class="header-section mb-4 d-flex align-items-center justify-content-center">
        <div class="text-section me-3">
            <h1 class="mb-0">Gestión de suministros</h1>
        </div>
        <div class="logo">
            <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest" height="100" width="100">
        </div>
    </div>

    <!-- MENSAJE DE ERROR Y BOTÓN VOLVER -->
    <div class="text-end mb-3">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/dashboard/admin" class="btn btn-outline-secondary btn-sm">Volver</a>
        </div>
    </div>

    <!-- FILTROS -->
<form method="get" th:action="@{/supply-admin}" class="mb-4">
    <div class="row g-3 align-items-end">

        <!-- Nombre -->
        <div class="col-md-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" th:value="${nombre}" placeholder="Sillas blancas">
        </div>

        <div class="col-md-3">
            <label for="lugarAlmacen" class="form-label">Lugar de Almacenaje</label>
            <input type="text" id="lugarAlmacen" name="lugarAlmacen" class="form-control" th:value="${lugarAlmacen}" placeholder="EJ: Almacen numero x">
        </div>

        <div class="col-md-3">
            <label for="stockActual" class="form-label">Cantidad del suministro</label>
            <input type="number" id="stockActual" name="stockActual" class="form-control" th:value="${stockActual}" placeholder="5">
        </div>

        <!-- Botones -->
        <div class="col-md-3 filtro-botones">
            <button type="submit" class="btn btn-primary btn-planifest">Filtrar</button>
            <a href="/supply-admin" class="btn btn-outline-secondary btn-planifest">Limpiar</a>
        </div>

    </div>
</form>

    <!-- TABLA DE Suministros -->
    <div class="contenedor-tabla">
        <div class="card shadow-sm border-0 fondo-transparente">
            <div class="card-header lista-suministros">
                <h5 class="mb-0">Lista de Suministros</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Tipo de suministro</th>
                                <th>Descripción</th>
                                <th>Almacén Localizado</th>
                                <th>Estado</th>
                                <th>Stock Actual</th>
                                <th>Stock Mínimo</th>
                                <th>Stock Máximo</th>
                                <th>Unidad</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${suministros}">
                                <td th:text="${t.name}"></td>
                                <td th:text="${t.supplyType}"></td>
                                <td th:text="${t.description}"></td>
                                <td th:text="${t.storageLocation}"></td>
                                <td>
                                    <span th:classappend="${t.status == 'AVAILABLE'} ? 'badge bg-success' : 'badge bg-warning text-dark'" th:text="${t.status}"></span>
                                </td>
                                <td th:text="${t.currentStock}"></td>
                                <td th:text="${t.minStock}"></td>
                                <td th:text="${t.maxStock}"></td>
                                <td th:text="${t.packagingUnit}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
