<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - PLANIFEST</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside>
            <div class="top">
                <div class="logo">
                    <img th:src="@{/images/home/logp.png}" alt="Logo">
                    <h2>Plani<span class="danger">Fest</span></h2>
                </div>
                <div class="close" id="close-btn">
                    <i class="bi bi-x-lg"></i>
                </div>
            </div>

            <div class="sidebar">
                <a th:href="@{/dashboard}" class="active"><i class="bi bi-grid"></i>
                    <h3>Home</h3>
                </a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-btn">
                        <i class="bi bi-door-open"></i>
                        <h3>Logout</h3>
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main>
            <h1 class="text-center">Assigned Tasks</h1>

            <!-- Filters -->
            <div class="date">
                <div class="row mb-4 justify-content-center">
                    <div class="col-md-3">
                        <label for="date" class="form-label fw-semibold">Date</label>
                        <input type="date" id="date" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select id="status" class="form-select">
                            <option value="">All</option>
                            <option value="pending">Pending</option>
                            <option value="in progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="event" class="form-label fw-semibold">Event</label>
                        <input type="text" id="event" class="form-control" placeholder="Search event...">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button onclick="filterTasks()" class="btn btn-gold w-100">Filter</button>
                    </div>
                </div>
            </div>

            <!-- Tasks Table -->
            <div class="recent-orders">
                <h2 class="text-center">Your Tasks</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Event</th>
                            <th>Task</th>
                            <th>Description</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="task-table-body">
                        <tr th:each="task : ${assignedTasks}">
                            <td th:text="${task.event.name}">Event Name</td>
                            <td th:text="${task.name}">Task Name</td>
                            <td th:text="${task.description}">Description</td>
                            <td th:text="${task.taskDate}">Date</td>
                            <td th:text="${task.status}">Status</td>
                        </tr>
                    </tbody>
                </table>
                <div th:replace="fragments/pagination :: pagination(${currentPage}, ${totalPages})"></div>
            </div>
        </main>

        <!-- Right Section (optional) -->
        <div class="right">
            <div class="top">
                <button id="menu-btn"><i class="bi bi-list"></i></button>
                <div class="theme-toggler" id="theme-toggler">
                    <i class="bi bi-sun active"></i>
                    <i class="bi bi-moon-stars"></i>
                </div>
                <div class="profile">
                    <div class="info">
                        <span th:if="${user != null}" th:text="${user.name}">Usuario</span>
                        <small class="text-muted">Employee</small>
                    </div>
                    <div class="profile-photo">
                        <img th:src="@{/images/.jpg}" alt="profile">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script th:src="@{/js/dashboard.js}"></script>
    <script>
        document.getElementById('menu-btn').addEventListener('click', () => {
            document.querySelector('aside').classList.toggle('showMenu');
        });

        async function filterTasks() {
            let date = document.getElementById('date').value;
            let status = document.getElementById('status').value;
            let event = document.getElementById('event').value;

            let query = new URLSearchParams({ date, status, event }).toString();

            try {
                let response = await fetch(`/employee/filter?${query}`);
                let data = await response.json();

                let tbody = document.getElementById('task-table-body');
                tbody.innerHTML = '';

                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No tasks found for the selected filters.</td></tr>';
                    return;
                }

                data.data.forEach(task => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${task.event.name}</td>
                            <td>${task.name}</td>
                            <td>${task.description}</td>
                            <td>${task.taskDate}</td>
                            <td>${task.status}</td>
                        </tr>`;
                });
            } catch (error) {
                console.error('Error while filtering tasks:', error);
            }
        }
    </script>
</body>

</html>
