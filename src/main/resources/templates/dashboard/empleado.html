<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empleado - Planifest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/empleado.css}">

</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="brand text-center">
                <img th:src="@{/images/dashboard/empleado.png}" alt="Logo de la Empresa">
            </div>

            <div class="text-center mt-auto">
                <form method="post" th:action="@{/logout}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="logout-button">
                        <i class="bx bx-log-out"></i> Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>

        <!-- Contenido principal -->
        <div id="content" class="main">
            <nav class="navbar mb-4">
                <i class="bx bx-menu" id="toggle-sidebar"></i>
                <span class="fs-5 fw-bold text-gold">Panel Empleado</span>
            </nav>

            <main>
                <h2 class="text-gold text-center mb-4">Tareas Asignadas</h2>

                <!-- Filtros -->
                <div class="row mb-4 justify-content-center">
                    <div class="col-md-3">
                        <label for="fecha" class="form-label fw-semibold">Fecha</label>
                        <input type="date" id="fecha" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="estado" class="form-label fw-semibold">Estado</label>
                        <select id="estado" class="form-select">
                            <option value="">Todos</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="en progreso">En progreso</option>
                            <option value="completado">Completado</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="evento" class="form-label fw-semibold">Evento</label>
                        <input type="text" id="evento" class="form-control" placeholder="Buscar evento...">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button onclick="filtrarTareas()" class="btn btn-gold w-100">Filtrar</button>
                    </div>
                </div>

                <!-- Tabla de tareas -->
                <div class="table-responsive bg-white rounded shadow p-3">
                    <table class="table table-bordered table-hover">
                        <thead class="text-center">
                            <tr>
                                <th>Evento</th>
                                <th>Tarea</th>
                                <th>Descripción</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-tareas-body">
                            <tr th:each="tarea : ${tareasAsignadas}">
                                <td th:text="${tarea.evento.nombre}"></td>
                                <td th:text="${tarea.nombre}"></td>
                                <td th:text="${tarea.descripcion}"></td>
                                <td th:text="${tarea.fechaTarea}"></td>
                                <td th:text="${tarea.estado}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('content').classList.toggle('expanded');
        });

        async function filtrarTareas() {
            let fecha = document.getElementById('fecha').value;
            let estado = document.getElementById('estado').value;
            let evento = document.getElementById('evento').value;

            let query = new URLSearchParams({
                fecha: fecha,
                estado: estado,
                evento: evento
            }).toString();

                try {
                let response = await fetch(`/empleado/filtro?${query}`);
                let data = await response.json();

                let tbody = document.getElementById('tabla-tareas-body');
                tbody.innerHTML = '';

                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay tareas para estos filtros.</td></tr>';
                    return;
                }

                data.data.forEach(tarea => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${tarea.evento.nombre}</td>
                            <td>${tarea.nombre}</td>
                            <td>${tarea.descripcion}</td>
                            <td>${tarea.fechaTarea}</td>
                            <td>${tarea.estado}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error al filtrar tareas:', error);
            }
        }
    </script>
</body>
</html>
