<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empleado - Planifest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/empleado.css}">
</head>

<body>
<div class="dashboard-wrapper">
    <div class="sidebar" id="sidebar">
        <div class="brand text-center">
            <img th:src="@{/images/dashboard/empleado.png}" alt="Logo de la Empresa">
        </div>

        <div class="text-center mt-auto">
            <form method="post" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-button">
                    <i class="bx bx-log-out"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Contenido principal -->
    <div id="content" class="main">
        <main>
            <h1>Empleado</h1>

            <!-- Filtros -->
            <div class="row mb-4 justify-content-center">
                <div class="col-md-3">
                    <label for="fecha" class="form-label fw-semibold">Fecha</label>
                    <input type="date" id="fecha" class="form-control">
                </div>
                <div class="col-md-3">
                    <label for="estado" class="form-label fw-semibold">Estado</label>
                    <select id="estado" class="form-select">
                        <option value="">Todos</option>
                        <option value="PENDING">Pendiente</option>
                        <option value="IN_PROGRESS">En progreso</option>
                        <option value="COMPLETED">Completado</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="evento" class="form-label fw-semibold">Evento</label>
                    <input type="text" id="evento" class="form-control" placeholder="Buscar evento...">
                </div>
                <div class="col-md-2 d-flex align-items-end gap-2">
                    <button onclick="filtrarTareas()" class="btn btn-gold w-100">Filtrar</button>
                    <button onclick="limpiarFiltros()" class="btn btn-secondary w-100">Limpiar</button>
                </div>
            </div>

            <!-- Tabla de tareas -->
            <div class="table-responsive bg-white rounded shadow p-3">
                <table class="table table-bordered table-hover">
                    <thead class="text-center">
                    <tr>
                        <th>Evento</th>
                        <th>Tarea</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                    </tr>
                    </thead>
                    <tbody id="tabla-tareas-body">
                    <tr th:each="tarea : ${tareasAsignadas}">
                        <td th:text="${tarea.event == null ? 'Sin evento' : tarea.event.eventName}"></td>
                        <td th:text="${tarea.name}"></td>
                        <td th:text="${tarea.description}"></td>
                        <td th:text="${#temporals.format(tarea.date, 'yyyy-MM-dd')}"></td>
                        <td th:text="${tarea.status}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- JS con las tareas cargadas -->
            <script th:inline="javascript">
                let tareasOriginales = /*[[${tareasAsignadas}]]*/ [];
            </script>

            <!-- Función JS para filtrar -->
            <script>
                function filtrarTareas() {
                    const fecha = document.getElementById('fecha').value;
                    const estado = document.getElementById('estado').value;
                    const evento = document.getElementById('evento').value.toLowerCase();

                    const tareasFiltradas = tareasOriginales.filter(t => {
                        const coincideFecha = !fecha || t.date === fecha;
                        const coincideEstado = !estado || t.status === estado;
                        const coincideEvento = !evento || (t.event && t.event.eventName.toLowerCase().includes(evento));
                        return coincideFecha && coincideEstado && coincideEvento;
                    });

                    const tbody = document.getElementById('tabla-tareas-body');
                    tbody.innerHTML = '';

                    if (tareasFiltradas.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay tareas para estos filtros.</td></tr>';
                        return;
                    }

                    tareasFiltradas.forEach(t => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${t.event ? t.event.eventName : 'Sin evento'}</td>
                                <td>${t.name}</td>
                                <td>${t.description}</td>
                                <td>${formatearFecha(t.date)}</td>
                                <td>${formatearEstado(t.status)}</td>
                            </tr>
                        `;
                    });
                }

                function formatearFecha(fecha) {
                    if (!fecha) return '';
                    const [y, m, d] = fecha.split('-');
                    return `${d}/${m}/${y}`;
                }

                function formatearEstado(status) {
                    switch (status) {
                        case 'PENDING': return 'Pendiente';
                        case 'IN_PROGRESS': return 'En progreso';
                        case 'COMPLETED': return 'Completado';
                        default: return status;
                    }
                }

                function limpiarFiltros() {
                    document.getElementById('fecha').value = '';
                    document.getElementById('estado').value = '';
                    document.getElementById('evento').value = '';
                    filtrarTareas();
                }
            </script>
        </main>
    </div>
</div>
</body>
</html>
