<script th:inline="javascript">
    let tareasOriginales = /*[[${tareasAsignadasDTO}]]*/ [];
</script>

<script>
    let map;
    let geocoder;

    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 4.7110, lng: -74.0721 },
            zoom: 13
        });
        geocoder = new google.maps.Geocoder();
        filtrarTareas();
    }

    function mostrarUbicacion(direccion) {
        geocoder.geocode({ address: direccion }, (results, status) => {
            if (status === "OK") {
                map.setCenter(results[0].geometry.location);
                new google.maps.Marker({
                    map: map,
                    position: results[0].geometry.location
                });
            } else {
                alert("No se encontró la dirección: " + status);
            }
        });
    }

    function filtrarTareas() {
        const fecha = document.getElementById('fecha').value;
        const estado = document.getElementById('estado').value;

        const tareasFiltradas = tareasOriginales.filter(t => {
            const coincideFecha = !fecha || (t.eventDate && t.eventDate.startsWith(fecha));
            const coincideEstado = !estado || (t.status && t.status === estado);
            return coincideFecha && coincideEstado;
        });

        const tbody = document.getElementById('tabla-tareas-body');
        tbody.innerHTML = '';

        if (tareasFiltradas.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay tareas para estos filtros.</td></tr>';
            return;
        }

        tareasFiltradas.forEach(t => {
            const fecha = t.eventDate ? t.eventDate.substring(0, 10) : '';
            tbody.innerHTML += `
                <tr>
                    <td>${t.eventName}</td>
                    <td><a href="javascript:void(0)" onclick="mostrarUbicacion('${t.eventLocation}')">${t.eventLocation}</a></td>
                    <td>${t.description || '-'}</td>
                    <td>${fecha}</td>
                    <td>${formatearEstado(t.status)}</td>
                </tr>
            `;
        });
    }

    function formatearEstado(status) {
        switch (status) {
            case 'PENDING': return 'Pendiente';
            case 'IN_PROGRESS': return 'En progreso';
            case 'COMPLETED': return 'Completado';
            default: return status || '-';
        }
    }

    function limpiarFiltros() {
        document.getElementById('fecha').value = '';
        document.getElementById('estado').value = '';
        filtrarTareas();
    }
</script>

<script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDWLM8nzHgCHy6QLiGnuDcNAQf8SJAVPwY&callback=initMap">
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
