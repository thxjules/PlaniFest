<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Planifest</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- BOTÓN HAMBURGUESA -->
  <button class="menu-toggle">
    <i class="bx bx-menu"></i>
  </button>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="top-section">
      <h2 class="fw-bold text-center">Administrador</h2>

      <a th:href="@{/employees-view}" th:classappend="${activePage == 'employees'} ? 'active'">
        <i class="bx bx-user"></i> Empleados
      </a>

      <a th:href="@{/clients-view}" th:classappend="${activePage == 'clients'} ? 'active'">
        <i class="bx bx-user"></i> Clientes
      </a>

      <a th:href="@{/events-view}" th:classappend="${activePage == 'events'} ? 'active'">
        <i class="bx bx-calendar"></i> Eventos
      </a>

      <a th:href="@{/tasks-view}" th:classappend="${activePage == 'tasks'} ? 'active'">
        <i class="bx bx-task"></i> Tareas
      </a>

      <a th:href="@{/supply-admin}" th:classappend="${activePage == 'supplies'} ? 'active'">
        <i class="bx bx-box"></i> Suministros
      </a>

      <a th:href="@{/planservices}" th:classappend="${activePage == 'services'} ? 'active'">
        <i class="bx bx-transfer"></i> Servicios
      </a>

      <a th:href="@{/admin/report}" class="slidebar text-center mt-3">
        📄 Descargar reporte PDF
      </a>

      <form method="post" th:action="@{/logout}" class="text-center mt-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="logout-button">
          <i class="bx bx-log-out"></i> Cerrar Sesión
        </button>
      </form>
    </div>

    <div class="logo text-center">
      <img th:src="@{/images/1.png}" alt="Logo Planifest" height="210">
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main">
    <h1>Panel de Administración</h1>

    <div class="alert alert-success mt-3" style="color:#111419; border:none; font-weight:600;">
      ¡Bienvenido Administrador! Nos alegra verte de nuevo en Planifest.
    </div>
    <div id="chatbot-widget">
    <div id="chatbot-btn">
        <img src="/images/chat-icon.png" alt="ChatBot">
    </div>
    <div id="chatbox">
        <div id="chat-header">
            <span>Chat Planifest</span>
            <button id="close-chat">✖</button>
        </div>
        <div id="messages"></div>
        <div id="chat-input">
            <input type="text" id="userInput" placeholder="Escribe un mensaje...">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>
</div>

    <!-- KPIS -->
    <div class="kpi-grid">
      <div class="kpi-card"><i class="bx bx-task"></i><h2>20</h2><p>Tareas</p></div>
      <div class="kpi-card"><i class="bx bx-user"></i><h2>10</h2><p>Empleados</p></div>
      <div class="kpi-card"><i class="bx bx-calendar"></i><h2>5</h2><p>Eventos</p></div>
      <div class="kpi-card"><i class="bx bx-box"></i><h2>15</h2><p>Suministros</p></div>
    </div>

    <div class="grid mt-5">
      <div class="card"><h3>Tareas</h3><canvas id="tasksChart"></canvas></div>
      <div class="card"><h3>Empleados</h3><canvas id="employeesChart"></canvas></div>
      <div class="card"><h3>Eventos</h3><canvas id="eventsChart"></canvas></div>
      <div class="card"><h3>Suministros</h3><canvas id="suppliesChart"></canvas></div>
    </div>
  </div>



  <!-- JS: CHARTS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      new Chart(tasksChart, {
        type: "bar",
        data: {
          labels: ["Pendientes", "Completadas"],
          datasets: [{data: [7, 13], backgroundColor:["#f8d794", "#b86830"]}]
        }
      });

      new Chart(employeesChart, {
        type: "bar",
        data: {
          labels: ["Empleados", "Admins"],
          datasets: [{data:[10,2], backgroundColor: ["#284139","#809076"]}]
        }
      });

      new Chart(eventsChart, {
        type: "line",
        data: {
          labels: ["Pendientes","Completados"],
          datasets:[{data:[2,3], borderColor:"#b86830", fill:false, tension:0.3}]
        }
      });

      new Chart(suppliesChart, {
        type:"pie",
        data:{
          labels:["Disponibles","Agotados"],
          datasets:[{data:[10,5], backgroundColor:["#284139","#f1dea8"]}]
        }
      });
    });
  </script>

  <!-- ALERTA DESAPARECE -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const alert = document.querySelector(".alert-success");
      if (alert) {
        setTimeout(() => {
          alert.style.transition = "opacity 1s";
          alert.style.opacity = "0";
        }, 5000);
      }
    });
  </script>

  <!-- MENÚ HAMBURGUESA -->
  <script>
    const toggleBtn = document.querySelector(".menu-toggle");
    const sidebar = document.querySelector(".sidebar");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
    });
  </script>

  <!-- CHATBOT -->
<script>
const chatBtn = document.getElementById("chatbot-btn");
const chatBox = document.getElementById("chatbox");
const closeBtn = document.getElementById("close-chat");
const sendBtn = document.getElementById("sendBtn");

chatBtn.addEventListener("click", () => {
    chatBox.classList.add("show");
});

closeBtn.addEventListener("click", () => {
    chatBox.classList.remove("show");
});

sendBtn.addEventListener("click", sendMessage);
document.getElementById("userInput").addEventListener("keypress", function(e) {
    if(e.key === "Enter") sendMessage();
});

async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    input.value = "";

    try {
        const response = await fetch("/chatbot/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) throw new Error("Error del servidor");

        const data = await response.json();
        appendMessage(data.reply, "bot");

    } catch (err) {
        console.error(err);
        appendMessage("Error en el servidor.", "bot");
    }
}

function appendMessage(text, type) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.textContent = text;
    div.className = `msg ${type}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}
</script>



</body>
</html>
