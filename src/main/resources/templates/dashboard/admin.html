<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Planifest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- Botón Hamburguesa -->
  <div class="hamburger" id="hamburgerBtn">
    <i class='bx bx-menu'></i>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div>
      <div class="brand px-2 mb-3">
        <h2 class="fw-bold">Administrador</h2>
      </div>
      <a th:href="@{/employees-view}" th:classappend="${activePage == 'employees'} ? 'active'"><i
          class="bx bx-user"></i> Empleados</a>
      <a th:href="@{/clients-view}" th:classappend="${activePage == 'clients'} ? 'active'"><i class="bx bx-user"></i>
        Clientes</a>
      <a th:href="@{/events-view}" th:classappend="${activePage == 'events'} ? 'active'"><i class="bx bx-calendar"></i>
        Eventos</a>
      <a th:href="@{/tasks-view}" th:classappend="${activePage == 'tasks'} ? 'active'"><i class="bx bx-task"></i>
        Tareas</a>
      <a th:href="@{/supply-admin}" th:classappend="${activePage == 'supplies'} ? 'active'"><i class="bx bx-box"></i>
        Suministros</a>
      <a th:href="@{/planservices}" th:classappend="${activePage == 'services'} ? 'active'"><i
          class="bx bx-transfer"></i> Servicios</a>

      <div class="text-center mt-4">
        <a th:href="@{/admin/report}" class="slidebar">
          📄 Descargar reporte PDF
        </a>
      </div>

      <form method="post" th:action="@{/logout}" class="mt-4 text-center">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="logout-button"><i class="bx bx-log-out"></i> Cerrar Sesión</button>
      </form>
    </div>

    <div class="logo text-center mt-3">
      <img th:src="@{/images/1.png}" alt="Logo Planifest" height="210px" width="210px">
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="main">
    <h1>Panel de Administración</h1>
    <div class="alert alert-success mt-3" role="alert" style="color:#111419; border:none; font-weight:600;">
      ¡Bienvenido Administrador! Nos alegra verte de nuevo en Planifest.
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card"><i class="bx bx-task"></i>
        <h2>20</h2>
        <p>Tareas</p>
      </div>
      <div class="kpi-card"><i class="bx bx-user"></i>
        <h2>10</h2>
        <p>Empleados</p>
      </div>
      <div class="kpi-card"><i class="bx bx-calendar"></i>
        <h2>5</h2>
        <p>Eventos</p>
      </div>
      <div class="kpi-card"><i class="bx bx-box"></i>
        <h2>15</h2>
        <p>Suministros</p>
      </div>
    </div>

    <!-- Gráficos -->
    <div class="grid mt-5">
      <div class="card">
        <h3>Tareas</h3><canvas id="tasksChart"></canvas>
      </div>
      <div class="card">
        <h3>Empleados</h3><canvas id="employeesChart"></canvas>
      </div>
      <div class="card">
        <h3>Eventos</h3><canvas id="eventsChart"></canvas>
      </div>
      <div class="card">
        <h3>Suministros</h3><canvas id="suppliesChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Script Charts -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const pendientes = 7, completadas = 13;
      const empleados = 10, admins = 2;
      const eventosPendientes = 2, eventosCompletados = 3;
      const insumosDisponibles = 10, insumosAgotados = 5;

      new Chart(document.getElementById("tasksChart"), {
        type: "bar",
        data: {
          labels: ["Pendientes", "Completadas"],
          datasets: [{
            label: "Tareas",
            data: [pendientes, completadas],
            backgroundColor: ["#f8d794", "#b86830"]
          }]
        }
      });

      new Chart(document.getElementById("employeesChart"), {
        type: "bar",
        data: {
          labels: ["Empleados", "Admins"],
          datasets: [{
            label: "Cantidad",
            data: [empleados, admins],
            backgroundColor: ["#284139", "#809076"]
          }]
        }
      });

      new Chart(document.getElementById("eventsChart"), {
        type: "line",
        data: {
          labels: ["Pendientes", "Completados"],
          datasets: [{
            label: "Eventos",
            data: [eventosPendientes, eventosCompletados],
            borderColor: "#b86830",
            backgroundColor: "#b86830",
            fill: false,
            tension: 0.3
          }]
        }
      });

      new Chart(document.getElementById("suppliesChart"), {
        type: "pie",
        data: {
          labels: ["Disponibles", "Agotados"],
          datasets: [{
            data: [insumosDisponibles, insumosAgotados],
            backgroundColor: ["#284139", "#f1dea8"]
          }]
        },
        options: { plugins: { legend: { position: "bottom" } } }
      });
    });
  </script>

  <!-- Hamburguesa JS -->
  <script>
    document.getElementById("hamburgerBtn").addEventListener("click", function () {
      document.querySelector(".sidebar").classList.toggle("active");
    });
  </script>

</body>
</html>
