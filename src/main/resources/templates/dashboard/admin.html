<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Planifest</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --emerald: #284139;
      --wasabi: #809076;
      --khaki: #f8d794;
      --earth: #b86830;
      --noir: #111419;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #fdf8f0;
      display: flex;
      min-height: 100vh;
    }

    /* =============== SIDEBAR ================== */
    .sidebar {
      width: 250px;
      background: var(--emerald);
      color: white;
      padding: 25px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      transition: all 0.3s ease;
      z-index: 999;
    }

    .sidebar a,
    .logout-button {
      display: block;
      padding: 12px;
      margin: 8px 0;
      background: transparent;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.2s;
      font-size: 0.95rem;
    }

    .sidebar a:hover,
    .logout-button:hover {
      background: var(--wasabi);
    }

    .logout-button {
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .logo img {
      filter: brightness(92%);
    }

    /* Sidebar activo en Thymeleaf */
    .active {
      background: var(--wasabi);
    }

    /* ======== Botón hamburguesa MOVIL ======== */
    .menu-toggle {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: var(--earth);
      padding: 10px;
      border-radius: 8px;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* =============== CONTENIDO PRINCIPAL ================== */
    .main {
      margin-left: 260px;
      padding: 30px;
      width: 100%;
    }

    h1 {
      font-weight: 700;
      color: var(--noir);
      margin-bottom: 20px;
    }

    .alert {
      border: none;
      font-weight: 600;
    }

    /* =============== KPI GRID ================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 30px 0;
    }

    .kpi-card {
      background: var(--khaki);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .kpi-card i {
      font-size: 2rem;
      color: var(--earth);
      margin-bottom: 10px;
    }

    .kpi-card h2 {
      font-size: 2rem;
      color: var(--noir);
    }

    .kpi-card p {
      font-weight: 600;
      color: var(--emerald);
    }

    /* =============== GRAFICOS ================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* =============== RESPONSIVE ================== */
    @media (max-width: 992px) {
      .sidebar {
        left: -260px;
        width: 260px;
      }

      .sidebar.open {
        left: 0;
      }

      .menu-toggle {
        display: block;
      }

      .main {
        margin-left: 0 !important;
        padding: 20px;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 576px) {
      h1 {
        font-size: 1.6rem;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .kpi-card h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>

  <!-- BOTÓN HAMBURGUESA -->
  <div class="menu-toggle"><i class="bx bx-menu"></i></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div>
      <h2 class="fw-bold px-2">Administrador</h2>

      <a href="/admin/profile"><i class="bx bx-user"></i> Mi Perfil</a>
      <a th:href="@{/employees-view}" th:classappend="${activePage == 'employees'} ? 'active'"><i class="bx bx-user"></i> Empleados</a>
      <a th:href="@{/clients-view}" th:classappend="${activePage == 'clients'} ? 'active'"><i class="bx bx-user"></i> Clientes</a>
      <a th:href="@{/events-view}" th:classappend="${activePage == 'events'} ? 'active'"><i class="bx bx-calendar"></i> Eventos</a>
      <a th:href="@{/tasks-view}" th:classappend="${activePage == 'tasks'} ? 'active'"><i class="bx bx-task"></i> Tareas</a>
      <a th:href="@{/supply-admin}" th:classappend="${activePage == 'supplies'} ? 'active'"><i class="bx bx-box"></i> Suministros</a>
      <a th:href="@{/planservices}" th:classappend="${activePage == 'services'} ? 'active'"><i class="bx bx-transfer"></i> Servicios</a>

      <div class="text-center mt-4">
        <button id="downloadPdfBtn" class="logout-button">
          📄 Descargar reporte PDF
        </button>
      </div>

      <form method="post" th:action="@{/logout}" class="mt-4 text-center">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="logout-button"><i class="bx bx-log-out"></i> Cerrar Sesión</button>
      </form>
    </div>

    <div class="logo text-center mt-3">
      <img th:src="@{/images/1.png}" alt="Logo Planifest" height="210">
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main">
    <h1>Panel de Administración</h1>

    <div class="alert alert-success mt-3" style="color:#111419;">
      ¡Bienvenido Administrador! Nos alegra verte de nuevo en Planifest.
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card"><i class="bx bx-task"></i><h2>20</h2><p>Tareas</p></div>
      <div class="kpi-card"><i class="bx bx-user"></i><h2>10</h2><p>Empleados</p></div>
      <div class="kpi-card"><i class="bx bx-calendar"></i><h2>5</h2><p>Eventos</p></div>
      <div class="kpi-card"><i class="bx bx-box"></i><h2>15</h2><p>Suministros</p></div>
    </div>

    <!-- GRAFICOS -->
    <div class="grid">
      <div class="card"><h3>Tareas</h3><canvas id="tasksChart"></canvas></div>
      <div class="card"><h3>Empleados</h3><canvas id="employeesChart"></canvas></div>
      <div class="card"><h3>Eventos</h3><canvas id="eventsChart"></canvas></div>
      <div class="card"><h3>Suministros</h3><canvas id="suppliesChart"></canvas></div>
    </div>

  </div>

  
  <script>
   
    document.querySelector(".menu-toggle").addEventListener("click", () => {
      document.querySelector(".sidebar").classList.toggle("open");
    });

   
    document.addEventListener("DOMContentLoaded", () => {
      const alert = document.querySelector(".alert-success");
      if (alert) {
        setTimeout(() => {
          alert.style.opacity = "0";
          alert.style.transition = "opacity 1s";
        }, 5000);
      }
    });

    // Botón PDF
    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('/admin/report');
        if (!response.ok) throw new Error('No se pudo generar el PDF');

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'reporte.pdf';
        a.click();
        window.URL.revokeObjectURL(url);

      } catch (err) {
        alert(err.message);
      }
    });

    // GRÁFICAS
    new Chart(document.getElementById("tasksChart"), {
      type: "bar",
      data: {
        labels: ["Pendientes", "Completadas"],
        datasets: [{
          label: "Tareas",
          data: [7, 13],
          backgroundColor: ["#f8d794", "#b86830"]
        }]
      }
    });

    new Chart(document.getElementById("employeesChart"), {
      type: "bar",
      data: {
        labels: ["Empleados", "Admins"],
        datasets: [{
          label: "Cantidad",
          data: [10, 2],
          backgroundColor: ["#284139", "#809076"]
        }]
      }
    });

    new Chart(document.getElementById("eventsChart"), {
      type: "line",
      data: {
        labels: ["Pendientes", "Completados"],
        datasets: [{
          label: "Eventos",
          data: [2, 3],
          borderColor: "#b86830",
          backgroundColor: "#b86830",
          fill: false,
          tension: 0.3
        }]
      }
    });

    new Chart(document.getElementById("suppliesChart"), {
      type: "pie",
      data: {
        labels: ["Disponibles", "Agotados"],
        datasets: [{
          data: [10, 5],
          backgroundColor: ["#284139", "#f1dea8"]
        }]
      }
    });
  </script>

</body>

</html>
