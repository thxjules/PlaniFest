<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Panel de Inventario - Planifest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fuentes y librerías -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/stock.css}">
  <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>
  <style>
    canvas {
      max-height: 180px;
    }
  </style>
  
   <button class="menu-toggle">
    <i class="bx bx-menu"></i>
  </button>

  <div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div>
        <h2>Inventario</h2>
        <a th:href="@{/admin/profile}" th:classappend="${activePage == 'profile'} ? 'active'">
          <i class="bx bx-user"></i> Mi Perfil
        </a>
        <a th:href="@{/supplies-view}" th:classappend="${activePage == 'supplies'} ? 'active'">
          <i class="bx bx-package"></i> Suministros
        </a>
        <a th:href="@{/stock-view}" th:classappend="${activePage == 'stock'} ? 'active'">
          <i class="bx bx-transfer"></i> Movimientos de stock
        </a>

        <div class="reporte">
          <div class="text-center mt-4">
            <button id="downloadPdfBtn" class="logout-button">
              <h6>📄Descargar reporte PDF</h6>
            </button>
          </div>
        </div>
      </div>

      <form id="logout-form" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="logout-button">
          <i class="bx bx-log-out"></i> Cerrar Sesión
        </button>
      </form>

      <div class="logo text-center">
        <img th:src="@{/images/1.png}" alt="Logo Planifest" height="210px" width="210px">
      </div>
    </div>

    <!-- Main -->
    <div class="main" id="main">
      <h1>Panel de Inventario</h1>

      <div class="row mt-4">
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card shadow p-3">
            <h5>Total de suministros</h5>
            <p class="fs-4" th:text="${totalSupplies}">0</p>
          </div>
        </div>
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card shadow p-3">
            <h5>Stock bajo</h5>
            <p class="fs-4 text-danger" th:text="${lowStockCount}">0</p>
          </div>
        </div>
      </div>

      <div class="col-md-12 mb-4">
        <div class="card shadow p-3">
          <h5>Movimientos de stock</h5>
          <canvas id="movementChart"></canvas>
        </div>
      </div>
    </div>
  </div>
  </div>
   <div id="chatbot-widget">
      <div id="chatbot-btn">
        <img th:src="@{/images/ia.png}" alt="Logo Planifest">
      </div>
      <div id="chatbox">
        <div id="chat-header">
          <span>Sienna - Chat Planifest</span>
          <button id="close-chat">✖</button>
        </div>
        <div id="messages"></div>
        <div id="chat-input">
          <input type="text" id="userInput" placeholder="Escribe un mensaje...">
          <button id="sendBtn">Enviar</button>
        </div>
      </div>
    </div>

  <!-- Scripts gráficos -->
  <script>
    // 🎨 Colores
    const colors = {
      emerald: '#284139',
      wasabi: '#809076',
      khaki: '#F8D794',
      earth: '#B86830',
      noir: '#111A19'
    };


    // 📊 Movimientos de stock
    new Chart(document.getElementById('movementChart'), {
      type: 'line',
      data: {
        labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
        datasets: [{
          label: 'Entradas',
          data: [10, 20, 15, 25],
          borderColor: colors.khaki,
          backgroundColor: colors.khaki,
          fill: false
        },
        {
          label: 'Salidas',
          data: [5, 15, 10, 20],
          borderColor: colors.earth,
          backgroundColor: colors.earth,
          fill: false
        }]
      },
      options: { responsive: true }
    });


    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('/admin/stock/report');

        if (!response.ok) {
          throw new Error('No se pudo generar el PDF');
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'reporte.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

      } catch (err) {
        alert(err.message);
      }
    });
  </script>
  <script>
    const toggleBtn = document.querySelector(".menu-toggle");
    const sidebar = document.querySelector(".sidebar");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
    });
  </script>
  <!-- CHATBOT -->
  <script>
    const chatBtn = document.getElementById("chatbot-btn");
    const chatBox = document.getElementById("chatbox");
    const closeBtn = document.getElementById("close-chat");
    const sendBtn = document.getElementById("sendBtn");
    const userInput = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    // Comandos rápidos sugeridos
    const quickCommands = [
      { text: "Ver suministros", message: "Muéstrame mis suministros" },
      { text: "Ver Movimientos", message: "Muéstrame mis movimientos de stock" },
      { text: "Ayuda", message: "Necesito ayuda" }
    ];

    // Abrir chat
    chatBtn.addEventListener("click", () => {
      chatBox.classList.add("show");
      if (!chatBox.dataset.initialized) {
        appendMessageTyping("¡Hola! Soy Sienna, tu asistente en Planifest. ¿En qué puedo ayudarte hoy?", "bot", () => {
          appendQuickButtons(quickCommands);
        });
        chatBox.dataset.initialized = "true";
      }
    });

    // Cerrar chat
    closeBtn.addEventListener("click", () => chatBox.classList.remove("show"));

    // Enviar mensaje con Enter o botón
    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    // Enviar mensaje al backend
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      userInput.value = "";

      // Ocultar botones rápidos al enviar nueva consulta
      removeQuickButtons();

      try {
        showTyping();
        const response = await fetch("/chatbot/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        hideTyping();

        if (!response.ok) throw new Error("Error del servidor");

        const data = await response.json();
        appendMessageTyping(data.reply, "bot", () => {
          // Sugerir botones contextuales según la respuesta
          appendQuickButtons(quickCommands);
        });

      } catch (err) {
        console.error(err);
        appendMessage("Error en el servidor.", "bot");
        hideTyping();
      }
    }

    // Función de mensaje normal
    function appendMessage(text, type) {
      const div = document.createElement("div");
      div.textContent = text;
      div.className = `msg ${type}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // Función de mensaje con tipeo animado
    function appendMessageTyping(text, type, callback) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;

      let i = 0;
      const interval = setInterval(() => {
        div.textContent += text.charAt(i);
        i++;
        messages.scrollTop = messages.scrollHeight;
        if (i >= text.length) {
          clearInterval(interval);
          if (callback) callback();
        }
      }, 15);
    }

    // Mostrar indicador de tipeo
    function showTyping() {
      const div = document.createElement("div");
      div.id = "typing-indicator";
      div.className = "msg bot";
      div.textContent = "Sienna está escribiendo...";
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // Ocultar indicador de tipeo
    function hideTyping() {
      const indicator = document.getElementById("typing-indicator");
      if (indicator) indicator.remove();
    }

    // Agregar botones rápidos
    function appendQuickButtons(buttons) {
      const container = document.createElement("div");
      container.className = "msg bot quick-buttons";

      buttons.forEach(btn => {
        const button = document.createElement("button");
        button.textContent = btn.text;
        button.onclick = () => {
          userInput.value = btn.message;
          sendMessage();
        };
        container.appendChild(button);
      });

      messages.appendChild(container);
      messages.scrollTop = messages.scrollHeight;
    }

    // Remover botones rápidos al enviar nueva consulta
    function removeQuickButtons() {
      const quickButtons = document.querySelectorAll(".quick-buttons");
      quickButtons.forEach(btn => btn.remove());
    }

  </script>


</body>

</html>
