<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Inventario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- BOTÓN PARA ABRIR MENU EN MÓVIL -->
    <button id="menuToggle" class="menu-toggle">
        ☰
    </button>

    <div class="dashboard-wrapper">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">

            <h2>Inventario</h2>

            <nav>
                <a th:href="@{/admin/profile}" th:classappend="${activePage == 'profile'} ? 'active'">
                    Mi Perfil
                </a>

                <a th:href="@{/supplies-view}" th:classappend="${activePage == 'supplies'} ? 'active'">
                    Suministros
                </a>

                <a th:href="@{/stock-view}" th:classappend="${activePage == 'stock'} ? 'active'">
                    Movimientos de stock
                </a>
            </nav>

            <div class="report-block">
                <button id="downloadPdfBtn" type="button">
                    Descargar reporte PDF
                </button>
            </div>

            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-button">Cerrar Sesión</button>
            </form>

            <div class="logo">
                <img th:src="@{/images/1.png}" alt="Logo Planifest">
            </div>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main" class="main">

            <h1>Panel de Inventario</h1>

            <div class="cards">
                <div class="card">
                    <h5>Total de suministros</h5>
                    <p th:text="${totalSupplies}">0</p>
                </div>

                <div class="card">
                    <h5>Stock bajo</h5>
                    <p th:text="${lowStockCount}">0</p>
                </div>
            </div>

            <div class="chart-section">
                <h5>Movimientos de stock</h5>
                <canvas id="movementChart"></canvas>
            </div>

        </main>
    </div>


    <!-- SCRIPT -->
    <script>
        const sidebar = document.getElementById("sidebar");
        const menuToggle = document.getElementById("menuToggle");

        menuToggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
        });

        // Gráfico
        const ctx = document.getElementById('movementChart');
        if (ctx) {
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
                    datasets: [
                        { label: 'Entradas', data: [10, 20, 15, 25] },
                        { label: 'Salidas', data: [5, 15, 10, 20] }
                    ]
                },
                options: {
                    responsive: true
                }
            });
        }

        // Botón PDF
        const downloadBtn = document.getElementById('downloadPdfBtn');
        downloadBtn.addEventListener('click', async () => {
            const response = await fetch('/admin/stock/report');
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'reporte.pdf';
            a.click();
        });
    </script>

</body>
</html>
