<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Inventario - Planifest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Estilos y fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/stock.css}">
</head>
<body>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div>
            <h2>Inventario</h2>
            <a th:href="@{/supplies-view}" th:classappend="${activePage == 'supplies'} ? 'active'">
                <i class="bx bx-package"></i> Suministros
            </a>
            <a th:href="@{/stock-view}" th:classappend="${activePage == 'stock'} ? 'active'">
                <i class="bx bx-transfer"></i> Movimientos de stock
            </a>

            <div class="text-center mt-4">
            <a th:href="@{/admin/stock/report}" class="btn-gold">
                📄 Descargar reporte PDF
            </a>
        </div>
        </div>

        <form id="logout-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-button">
                <i class="bx bx-log-out"></i> Cerrar Sesión
            </button>
        </form>

        <div class="logo text-center">
            <img th:src="@{/images/dashboard/stock.png}" alt="Logo Planifest">
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main" id="main">
        <h1>Panel de Inventario</h1>

        <div class="row mt-4">
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card shadow p-3">
                    <h5 class="text-gold">Total de suministros</h5>
                    <p class="fs-4" th:text="${totalSupplies}">0</p>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card shadow p-3">
                    <h5 class="text-gold">Stock bajo</h5>
                    <p class="fs-4 text-danger" th:text="${lowStockCount}">0</p>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card shadow p-3">
                    <h5 class="text-gold">Movimientos totales</h5>
                    <p class="fs-4" th:text="${totalMovements}">0</p>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-md-6 mb-4">
                <div class="card shadow p-3">
                    <h5 class="text-gold">Últimos movimientos</h5>
                    <ul class="mb-0" th:if="${#lists.isEmpty(recentMovements) == false}">
                        <li th:each="m : ${recentMovements}">
                            <strong th:text="${#temporals.format(m.date, 'dd/MM/yyyy')}"></strong> - 
                            <span th:text="${m.type}"></span> - 
                            <span th:text="${m.quantity + ' ' + m.supply.packagingUnit + ' de ' + m.supply.name}"></span>
                        </li>
                    </ul>
                    <p th:if="${#lists.isEmpty(recentMovements)}">Sin registros recientes.</p>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card shadow p-3">
                    <h5 class="text-gold">Suministros críticos</h5>
                    <ul class="mb-0" th:if="${#lists.isEmpty(criticalSupplies) == false}">
                        <li th:each="s : ${criticalSupplies}">
                            <span th:text="${s.name}"></span> - 
                            <span class="text-danger" th:text="'Stock: ' + s.currentStock + ' / ' + s.minStock"></span>
                        </li>
                    </ul>
                    <p th:if="${#lists.isEmpty(criticalSupplies)}">Todo en orden.</p>
                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
