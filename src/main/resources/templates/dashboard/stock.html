<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management - Catering Soft</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

    <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <div>
            <h2>Catering Soft</h2>
            <a th:href="@{/supplies}" class="active">Supplies</a>
        </div>
        <a href="#" th:onclick="|event.preventDefault(); document.getElementById('logout-form').submit();|"
            class="logout-button">
            <i class='bx bx-log-out'></i> Logout
        </a>
        <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;"></form>
        <div class="logo text-center">
            <img th:src="@{/img/home/planifest.png}" alt="Company Logo">
        </div>
    </div>

    <div class="main" id="main">
        <h1>Inventory Management</h1>

        <div class="card shadow mb-5">
            <div class="card-body">
                <h3 class="mb-4 text-gold">Supply List</h3>

                <!-- Filters -->
                <form method="GET" th:action="@{/supplies/filter}" class="row g-3 mb-4">
                    <div class="col-md-5">
                        <input type="text" name="name" class="form-control" placeholder="Search by name"
                            th:value="${name}">
                    </div>
                    <div class="col-md-5">
                        <input type="number" name="minQuantity" class="form-control" placeholder="Minimum quantity"
                            th:value="${minQuantity}">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn-gold">Filter</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light text-center">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Quantity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="supply : ${supplies}">
                                <td class="text-center" th:text="${supply.id}">1</td>
                                <td th:text="${supply.name}">Supply Name</td>
                                <td class="text-center" th:text="${supply.quantity}">100</td>
                                <td class="text-center">
                                    <a th:href="@{'/supplies/edit/' + ${supply.id}}"
                                        class="btn btn-sm btn-outline-warning">Edit</a>
                                    <form th:action="@{'/supplies/delete/' + ${supply.id}}" method="post"
                                        class="d-inline">
                                        <input type="hidden" name="_method" value="delete" />
                                        <button class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Are you sure you want to delete this supply?')">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(supplies)}">
                                <td colspan="4" class="text-center text-muted">No supplies registered.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/supplies/create}" class="btn-gold">
                        Create New Supply
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main');
            sidebar.classList.toggle('show');
            main.classList.toggle('sidebar-hidden');
        }
    </script>

</body>

</html>
