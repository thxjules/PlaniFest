<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Panel de Inventario - Planifest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fuentes y librerías -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
   <link rel="stylesheet" th:href="@{/css/dashboard.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* 🎨 Colores */
    :root {
      --emerald-green: #284139;
      --wasabi: #809076;
      --creased-khaki: #F8D794;
      --egyptian-earth: #B86830;
      --noir-de-vigne: #111A19;
      --text-light: #f8f9fa;
    }


    canvas {
      max-height: 180px;
    }
  </style>
</head>

<body>
  <div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div>
        <h2>Inventario</h2>
        <a th:href="@{/supplies-view}" th:classappend="${activePage == 'supplies'} ? 'active'">
          <i class="bx bx-package"></i> Suministros
        </a>
        <a th:href="@{/stock-view}" th:classappend="${activePage == 'stock'} ? 'active'">
          <i class="bx bx-transfer"></i> Movimientos de stock
        </a>

         <div class="text-center mt-4">
                    <a th:href="@{/admin/stock/report}" class="btn-gold">
                        📄 Descargar reporte PDF
                    </a>
                </div>
      </div>

      <form id="logout-form" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="logout-button">
          <i class="bx bx-log-out"></i> Cerrar Sesión
        </button>
      </form>

      <div class="logo text-center">
        <img th:src="@{/images/dashboard/logoplanifest.png}" alt="Logo Planifest">
      </div>
    </div>

    <!-- Main -->
    <div class="main" id="main">
      <h1>Panel de Inventario</h1>

      <div class="row mt-4">
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card shadow p-3">
            <h5>Total de suministros</h5>
            <p class="fs-4" th:text="${totalSupplies}">0</p>
          </div>
        </div>
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card shadow p-3">
            <h5>Stock bajo</h5>
            <p class="fs-4 text-danger" th:text="${lowStockCount}">0</p>
          </div>
        </div>
      </div>

        <div class="col-md-12 mb-4">
          <div class="card shadow p-3">
            <h5>Movimientos de stock</h5>
            <canvas id="movementChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts gráficos -->
  <script>
    // 🎨 Colores
    const colors = {
      emerald: '#284139',
      wasabi: '#809076',
      khaki: '#F8D794',
      earth: '#B86830',
      noir: '#111A19'
    };


    // 📊 Movimientos de stock
    new Chart(document.getElementById('movementChart'), {
      type: 'line',
      data: {
        labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
        datasets: [{
          label: 'Entradas',
          data: [10, 20, 15, 25],
          borderColor: colors.khaki,
          backgroundColor: colors.khaki,
          fill: false
        },
        {
          label: 'Salidas',
          data: [5, 15, 10, 20],
          borderColor: colors.earth,
          backgroundColor: colors.earth,
          fill: false
        }]
      },
      options: { responsive: true }
    });
  </script>
</body>

</html>
