<form th:action="@{/supplies-view/save}" th:object="${supply}" method="post">
    <div class="mb-3">
        <label for="name" class="form-label">Nombre:</label>
        <input type="text" class="form-control" th:field="*{name}" id="name" required>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Descripción:</label>
        <textarea class="form-control" th:field="*{description}" id="description" rows="3"></textarea>
    </div>

    <div class="mb-3">
        <label for="minStock" class="form-label">Stock mínimo:</label>
        <input type="number" class="form-control" th:field="*{minStock}" id="minStock">
    </div>

    <div class="mb-3">
        <label for="currentStock" class="form-label">Stock actual:</label>
        <input type="number" class="form-control" th:field="*{currentStock}" id="currentStock">
    </div>

    <div class="mb-3">
        <label for="maxStock" class="form-label">Stock máximo:</label>
        <input type="number" class="form-control" th:field="*{maxStock}" id="maxStock">
    </div>

    <div class="mb-3">
        <label for="status" class="form-label">Disponibilidad:</label>
        <select class="form-select" th:field="*{status}" id="status">
            <option th:value="AVAILABLE">Disponible</option>
            <option th:value="UNAVAILABLE">No Disponible</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="supplyType" class="form-label">Tipo de Insumo:</label>
        <input type="text" class="form-control" th:field="*{supplyType}" id="supplyType" required>
    </div>

    <div class="mb-3">
        <label for="storageLocation" class="form-label">Lugar de Almacenamiento:</label>
        <input type="text" class="form-control" th:field="*{storageLocation}" id="storageLocation" required>
    </div>

    <!-- Puedes usar este campo solo si tienes lógica para asociar Supply con Evento -->
    <!-- O eliminarlo si no estás manejando evento directamente en el Supply -->
    <div class="mb-4">
        <label for="events" class="form-label">Asignar a Evento:</label>
        <select class="form-select" multiple th:field="*{events}" id="events">
            <option th:each="evento : ${events}"
                    th:value="${evento.id}"
                    th:text="${evento.name}"></option>
        </select>
    </div>

    <div class="text-end">
        <button type="submit" class="btn btn-gold px-4 py-2">Crear Insumo</button>
    </div>
</form>
