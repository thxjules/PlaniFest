<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/employees.css">
    <link rel="icon"  th:href="@{/images/planifest.png}" type="image/png">

</head>
<body>
<div class="container py-5">
    <div th:if="${success}" class="alert alert-success text-center" role="alert">
        <span th:text="${success}"></span>
    </div>
    <div class="header-section mb-4 text-center">
            <img th:src="@{/images/planifest.png}" alt="Logo Planifest" style="max-height: 200px;">
          <h1 class="mb-4 text-center">Empleados</h1>
            <p class="mt-2">Empleados Registrados</p>
        </div>

    <

    <form th:action="@{/employees-view}" method="get" class="row mb-4">
        <div class="col-md-4 offset-md-4 d-flex align-items-center gap-2">
            <label for="positionFilter" class="form-label mb-0">Filtrar por posición:</label>
            <select name="positionId" id="positionFilter" class="form-select" onchange="this.form.submit()">
                <option value="">-- Todas --</option>
                <option th:each="pos : ${posiciones}"
                        th:value="${pos.id}"
                        th:text="${pos.name}"
                        th:selected="${pos.id == positionId}">
                </option>
            </select>
        </div>
    </form>

    <!-- Tabla de empleados -->
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Posición</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empleado : ${empleados}">
            <td th:text="${empleado.username}">Nombre</td>
            <td th:text="${empleado.email}">Correo</td>
            <td th:text="${empleado.phoneNumber}">Teléfono</td>
            <td th:text="${empleado.role}">Rol</td>
            <td>
                <div th:if="${empleado.role.name() == 'EMPLOYEE'}">
                    <form th:action="@{/employees-view/actualizar}" method="post" class="d-flex align-items-center gap-2">
                        <input type="hidden" name="id" th:value="${empleado.id}" />
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <select name="positionId" class="form-select form-select-sm">
                            <option th:each="pos : ${posiciones}"
                                    th:value="${pos.id}"
                                    th:selected="${pos.id == empleado.position?.id}"
                                    th:text="${pos.name}">
                            </option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
                    </form>
                </div>
                <div th:if="${empleado.role.name() != 'EMPLOYEE'}">
                    <span class="text-muted">No editable</span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/dashboard/admin" class="btn btn-outline-secondary mt-3">Volver</a>
</div>
</body>
</html>
