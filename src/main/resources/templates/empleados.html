<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div th:if="${success}" class="alert alert-success text-center" role="alert">
        <span th:text="${success}"></span>
    </div>
    <h2 class="mb-4 text-center">👥 Empleados</h2>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Rol</th>
                <th>Posición</th>
                
            </tr>
        </thead>
        <tbody>
            <tr th:each="empleado : ${empleados}">
                <td th:text="${empleado.username}">Nombre</td>
                <td th:text="${empleado.email}">Correo</td>
                <td th:text="${empleado.phoneNumber}">Teléfono</td>
                <td th:text="${empleado.role}">Rol</td>

                <!-- Solo si es EMPLOYEE permite editar -->
                <td>
    <div th:if="${empleado.role.name() == 'EMPLOYEE'}">
        <form th:action="@{/employees-view/actualizar}" method="post" class="d-flex align-items-center gap-2">
            <input type="hidden" name="id" th:value="${empleado.id}" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <select name="positionId" class="form-select form-select-sm">
                <option th:each="pos : ${posiciones}"
                        th:value="${pos.id}"
                        th:selected="${pos.id == empleado.position?.id}"
                        th:text="${pos.name}">
                </option>
            </select>
            <button type="submit" class="btn btn-primary btn-sm">💾 Guardar</button>
        </form>
    </div>
    <div th:if="${empleado.role.name() != 'EMPLOYEE'}">
        <span class="text-muted">No editable</span>
    </div>
</td>

                <td><!-- Acciones futuras (eliminar, etc.) --></td>
            </tr>
        </tbody>
    </table>

    <a href="/dashboard/admin" class="btn btn-outline-secondary mt-3">🔙 Volver</a>
</div>
</body>
</html>
