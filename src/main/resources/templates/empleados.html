<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/employees.css">
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">
</head>

<body>
    <div class="container py-5">
        <!-- Mensajes de éxito o error -->
        <div th:if="${success}" class="alert alert-success text-center" role="alert">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger text-center" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Encabezado -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">
                <i class="bi bi-people-fill me-2"></i> Empleados
            </h1>
            <p class="text-muted">Administra los empleados registrados en el sistema.</p>
        </div>

        <div class="card shadow-sm border-0 p-4 mb-4">

            <!-- Filtro -->
            <form th:action="@{/employees-view}" method="get" class="row mb-4">
                <div class="col-md-4 offset-md-4 d-flex align-items-center gap-2">
                    <label for="positionFilter" class="form-label mb-0 fw-semibold">Filtrar por posición:</label>
                    <select name="positionId" id="positionFilter" class="form-select" onchange="this.form.submit()">
                        <option value="">-- Todas --</option>
                        <option th:each="pos : ${posiciones}" th:value="${pos.id}" th:text="${pos.name}"
                            th:selected="${pos.id == positionId}">
                        </option>
                    </select>
                    <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest" height="100px" width="100px">
                </div>
            </form>

            <hr>

            <!-- Tabla de empleados -->
            <table class="table table-hover align-middle">
    <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Posición</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="empleado : ${empleados}">
            <td th:text="${empleado.username}"></td>
            <td th:text="${empleado.email}"></td>
            <td th:text="${empleado.phoneNumber}"></td>
            <td th:text="${empleado.role}"></td>

            <td>
                <div th:if="${empleado.role.name() == 'EMPLOYEE'}" class="d-flex align-items-center gap-2 flex-wrap">
                    <form th:action="@{/employees-view/actualizar}" method="post" class="m-0 flex-grow-1">
                        <input type="hidden" name="id" th:value="${empleado.id}" />
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <select name="positionId" class="form-select form-select-sm">
                            <option th:each="pos : ${posiciones}" th:value="${pos.id}"
                                    th:selected="${pos.id == empleado.position?.id}" th:text="${pos.name}">
                            </option>
                        </select>
                    </form>
                </div>
                <div th:if="${empleado.role.name() != 'EMPLOYEE'}">
                    <span class="text-muted fst-italic">No editable</span>
                </div>
            </td>

            <td>
                <div th:if="${empleado.role.name() == 'EMPLOYEE'}" class="d-flex gap-2 flex-wrap">
                    <!-- Botón Guardar -->
                    <form th:action="@{/employees-view/actualizar}" method="post" class="m-0 flex-grow-1">
                        <input type="hidden" name="id" th:value="${empleado.id}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-primary btn-sm w-100">Guardar</button>
                    </form>

                    <!-- Botón Eliminar -->
                    <form th:action="@{/employees-view/eliminar/{id}(id=${empleado.id})}" method="post"
                          class="m-0 flex-grow-1 eliminar-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="button" class="btn btn-danger btn-sm w-100 btn-eliminar">Eliminar</button>
                    </form>
                </div>
            </td>
        </tr>

        <!-- Si no hay empleados -->
        <tr th:if="${empleados.size() == 0}">
            <td colspan="6" class="text-center py-4 text-muted">
                No hay empleados registrados.
            </td>
        </tr>
    </tbody>
</table>


      <div class="btn-volver-container">
    <a href="/dashboard/admin" class="btn btn-outline-secondary btn-volver">Volver</a>
</div>
    </div>

    

    <!-- Script para manejar el modal -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const modal = document.getElementById('confirmDeleteModal');
            const deleteForm = document.getElementById('deleteForm');

            modal.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const id = button.getAttribute('data-id');

                deleteForm.action = `/employees-view/eliminar/${id}`;
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.querySelectorAll('.btn-eliminar').forEach(boton => {
        boton.addEventListener('click', function () {

            const form = this.closest('.eliminar-form');

            Swal.fire({
                title: '¿Eliminar empleado?',
                text: "Esta acción no se puede deshacer.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                reverseButtons: true
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
