<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Planifest - Lista de Movimiento del stock</title>
    <link rel="stylesheet" th:href="@{/css/stockMo.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">
</head>

<body>

    <div class="container py-5">

        <!-- HEADER -->
        <div class="header-section mb-4 d-flex align-items-center justify-content-center">
            <div class="text-section me-3">
                <h1 class="mb-0">Gestión de movimiento</h1>
                <p class="mt-2">Crea y organiza los movimientos de stock</p>
            </div>
            <div class="logo">
                <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest" height="100" width="100">
            </div>
        </div>

        <!-- MENSAJE DE ÉXITO -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- MENSAJE DE ERROR Y BOTONES PRINCIPALES -->
        <div class="text-end mb-3">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error:</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a href="/dashboard/stock" class="btn btn-limpiar btn-sm">Volver</a>
                <button class="btn btn-filtrar btn-sm" type="button" data-bs-toggle="collapse"
                    data-bs-target="#formularioStock" aria-expanded="false" aria-controls="formularioStock">
                    Nuevo Movimiento
                </button>
            </div>
        </div>

        <!-- FORMULARIO DE MOVIMIENTO -->
        <div th:class="${stockMovement.id != null} ? 'collapse show' : 'collapse'" id="formularioStock">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header nuevo-movimiento">
                    <h5 class="mb-0" th:text="${stockMovement.id != null} ? 'Editar Stock' : 'Nuevo Stock'">
                        Formulario de Movimiento stock
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/stock-view/save}" method="post" th:object="${stockMovement}">
                        <input type="hidden" th:field="*{id}" />
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Fecha</label>
                                <input type="date" th:field="*{date}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cantidad</label>
                                <input type="number" min="0" th:field="*{quantity}" class="form-control" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tipo de Movimiento</label>
                                <select th:field="*{type}" class="form-select">
                                    <option value="ENTRY">Entrada</option>
                                    <option value="EXIT">Salida</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Observación</label>
                                <textarea th:field="*{remarks}" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Suministro</label>
                                <select th:field="*{supply.id}" class="form-select">
                                    <option th:each="supply : ${supplies}" th:value="${supply.id}" th:text="${supply.Name}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-success">
                                <span th:text="${stockMovement.id != null} ? 'Actualizar Movimiento stock' : 'Guardar Movimiento stock'">
                                    Guardar Movimiento stock
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- FILTRO DE BÚSQUEDA -->
        <form method="get" th:action="@{/stock-view}" class="mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" class="form-control" placeholder="20" th:value="${cantidad}">
                </div>
                <div class="col-md-2">
                    <label for="tipo" class="form-label">Tipo de Movimiento</label>
                    <select class="form-select" id="tipo" name="tipo">
                        <option value="">Todos</option>
                        <option value="ENTRY" th:selected="${tipo == 'ENTRY'}">Entrada</option>
                        <option value="EXIT" th:selected="${tipo == 'EXIT'}">Salida</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="suministro" class="form-label">Suministro</label>
                    <select class="form-select" id="suministro" name="suministroId">
                        <option value="">Todos</option>
                        <option th:each="suministro : ${supplies}" th:value="${suministro.id}" th:text="${suministro.name}" th:selected="${suministro.id == suministroId}"></option>
                    </select>
                </div>
                <div class="col-md-2 filtro-botones">
                    <button type="submit" class="btn btn-filtrar btn-planifest">Filtrar</button>
                    <a href="/stock-view" class="btn btn-limpiar btn-planifest">Limpiar</a>
                </div>
            </div>
        </form>

        <!-- TABLA DE MOVIMIENTOS -->
        <div class="card shadow-sm border-0">
            <div class="card-header lista-movimiento">
                <h5 class="mb-0">Lista de Movimientos</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha</th>
                                <th>Cantidad</th>
                                <th>Tipo</th>
                                <th>Observaciones</th>
                                <th>Suministro</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${stockMovements}">
                                <td th:text="${t.date}"></td>
                                <td th:text="${t.quantity}"></td>
                                <td th:text="${t.type}"></td>
                                <td th:text="${t.remarks}"></td>
                                <td th:text="${t.supply.Name}"></td>
                                <td class="text-center col-botones">
                                    <a th:href="@{/stock-view(id=${t.id})}" class="btn btn-editar btn-sm me-1">Editar</a>
                                    <button type="button" class="btn btn-eliminar btn-sm btn-delete" th:data-id="${t.id}">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- SWEETALERT2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.querySelectorAll('.btn-delete').forEach(button => {
            button.addEventListener('click', function () {
                const id = this.dataset.id;

                Swal.fire({
                    title: '¿Estás segura?',
                    text: "Esta seguro quiere eliminar este movimiento de stock.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#9f6920',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar',
                    reverseButtons: true,
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = `/stock-view/delete/${id}`;
                    }
                });
            });
        });
    </script>

</body>
</html>
