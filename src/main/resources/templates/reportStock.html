<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Stock Report</title>
    <style>
        body {
            background-color: #ffffff;
            background-size: cover;
            background-repeat: no-repeat;
            color: #000000;
            font-family: serif;
            padding: 40px;
        }

        .report-container {
            background-color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #000000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #a54c03;
            padding: 6px;
            text-align: center;
        }

        th {
            background-color: #3b2004;
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f3f2d3;
        }

        .low-stock {
            font-weight: bold;
            color: #000000;
        }

        .footer {
            margin-top: 30px;
            font-size: 10px;
            text-align: center;
            color: #000000;
        }
    </style>
</head>
<body>
    <img th:src="'data:image/png;base64,' + ${logoBase64}" alt="logo" style="width:120px;"/>

    <div class="report-container">
        <h1>Reporte de Inventario - PlaniFest</h1>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Descripción</th>
                    <th>Ubicación</th>
                    <th>Estado</th>
                    <th>Stock Actual</th>
                    <th>Stock Mínimo</th>
                    <th>Stock Máximo</th>
                    <th>Unidad</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="supply : ${supplies}">
                    <td th:text="${supply.name}">Nombre</td>
                    <td th:text="${supply.supplyType}">Tipo</td>
                    <td th:text="${supply.description}">Descripción</td>
                    <td th:text="${supply.storageLocation}">Ubicación</td>
                    <td th:text="${supply.status}">Estado</td>
                    <td th:text="${supply.currentStock}" 
                        th:classappend="${supply.currentStock} &lt;= ${supply.minStock} ? 'low-stock' : ''">Actual</td>
                    <td th:text="${supply.minStock}">Min</td>
                    <td th:text="${supply.maxStock}">Max</td>
                    <td th:text="${supply.packagingUnit}">Unidad</td>
                </tr>
            </tbody>
        </table>
        <div class="footer">
            Reporte generado automáticamente por el sistema el 
            <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}">fecha</span>.
        </div>
    </div>
</body>
</html>
