<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Planifest - Gestión de Clientes</title>

    <!-- CSS propio -->
    <link rel="stylesheet" th:href="@{/css/clients.css}">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">
</head>

<body>

    <div class="container py-5">

        <!-- ALERTAS -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- ENCABEZADO -->
        <div class="header-section mb-4 d-flex align-items-center justify-content-center">
            <div class="text-section me-3 text-end">
                <h1 class="mb-0">Gestión de Clientes</h1>
                <p class="mt-2">Agrega, edita o elimina clientes</p>
            </div>
            <div class="logo">
                <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest" height="100" width="100">
            </div>
        </div>

        <!-- CONTROLES SUPERIORES -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/dashboard/admin}" class="btn btn-outline-secondary btn-sm">Volver</a>

            <button class="btn btn-outline-primary btn-sm"
                    data-bs-toggle="collapse"
                    data-bs-target="#formularioCliente">
                Nuevo cliente
            </button>
        </div>

        <!-- IMPORTAR CLIENTES -->
        <form th:action="@{/api/import-export/client/import}" method="post" enctype="multipart/form-data" class="mb-4">
            <label for="fileClient" class="form-label">Importar clientes desde Excel/CSV</label>
            <div class="input-group">
                <input type="file" id="fileClient" name="file" class="form-control" required>
                <button type="submit" class="btn btn-success">Importar Clientes</button>
            </div>
        </form>

        <!-- FORMULARIO -->
        <div th:class="${client != null && client.id != null} ? 'collapse show' : 'collapse'" id="formularioCliente">
            <div class="card mb-4">

                <div class="card-header custom-header">
                    <h5 class="mb-0"
                        th:text="${client != null && client.id != null} ? 'Editar Cliente' : 'Nuevo Cliente'">
                        Formulario
                    </h5>
                </div>

                <div class="card-body">
                    <form th:action="@{/clients-view/save}" method="post" th:object="${client}">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" th:field="*{phone}" class="form-control" required>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-success">
                                <span th:text="${client != null && client.id != null} ? 'Actualizar' : 'Guardar'"></span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>

        <!-- FILTROS -->
        <form method="get" th:action="@{/clients-view}" class="mb-4">
            <div class="row g-3 align-items-end">

                <div class="col-md-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text"
                           id="nombre"
                           name="nombre"
                           class="form-control"
                           th:value="${nombre}"
                           placeholder="Diana ...">
                </div>

                <div class="col-md-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           th:value="${email}"
                           placeholder="nombre@gmail.com">
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-primary w-50">Buscar</button>
                    <a href="/clients-view" class="btn btn-outline-secondary w-50">Limpiar</a>
                </div>

            </div>
        </form>

        <!-- TABLA -->
        <div class="card">
            <div class="card-header custom-header">
                <h5 class="mb-0">Lista de Clientes</h5>
            </div>

            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="custom-thead">
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="c : ${clientes}">
                            <td th:text="${c.name}"></td>
                            <td th:text="${c.email}"></td>
                            <td th:text="${c.phone}"></td>

                            <td class="text-center">
                                <a th:href="@{/clients-view(id=${c.id})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    Editar
                                </a>

                                <button type="button"
                                        class="btn btn-sm btn-outline-danger btn-eliminar"
                                        th:data-id="${c.id}">
                                    Eliminar
                                </button>
                            </td>
                        </tr>

                        <tr th:if="${clientes.size() == 0}">
                            <td colspan="4" class="text-center text-muted py-3">
                                No hay clientes registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CONFIRMACIÓN ELIMINAR -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".btn-eliminar").forEach(btn => {
                btn.addEventListener("click", () => {

                    const clientId = btn.getAttribute("data-id");

                    Swal.fire({
                        title: "¿Eliminar cliente?",
                        text: "Esta acción no se puede deshacer.",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: "#d33",
                        cancelButtonColor: "#3085d6",
                        confirmButtonText: "Sí, eliminar",
                        cancelButtonText: "Cancelar"
                    }).then(result => {
                        if (result.isConfirmed) {
                            window.location.href = `/clients-view/delete/${clientId}`;
                        }
                    });

                });
            });
        });
    </script>

</body>

</html>
