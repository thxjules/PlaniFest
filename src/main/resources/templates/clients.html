<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Planifest - Gestión de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/clients.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">

    <div class="text-center mb-4 text-center">
        <img src="/images/planifest.png" alt="Logo Planifest" style="max-height: 200px;">
        <h1>👥 Gestión de Clientes</h1>
        <p>Agrega, edita o elimina clientes</p>
    </div>

    <!-- BOTONES ENCIMA -->
    <div class="d-flex justify-content-between align-items-center mb-3">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <a th:href="@{/dashboard/admin}" class="btn btn-outline-secondary btn-sm">🏠 Volver</a>
        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#formularioCliente">
            ➕ Nuevo cliente
        </button>
    </div>

    <!-- FORMULARIO -->
    <div th:class="${client != null and client.id != null} ? 'collapse show' : 'collapse'" id="formularioCliente">
        <div class="card mb-4">
            <div class="card-header bg-ligth text-white">
                <h5 class="mb-0" th:text="${client != null and client.id != null} ? 'Editar Cliente' : 'Nuevo Cliente'">Formulario</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/clients-view/save}" method="post" th:object="${client}">
                    <input type="hidden" th:field="*{id}" />
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{name}" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" th:field="*{email}" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:field="*{phone}" class="form-control" required />
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-success">
                            <span th:text="${client != null and client.id != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Filtros multitbla -->

    <form method="get" th:action="@{/clients-view}" class="mb-4">
    <div class="row g-3 align-items-end">

        <!-- Nombre -->
        <div class="col-md-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" th:value="${nombre}" placeholder="Diana ...">
        </div>

        <div class="col-md-3">
            <label for="nombre" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" th:value="${email}" placeholder="nombre@gmail.com">
        </div>

        <!-- Botones -->
        <div class="col-md-2 filtro-botones">
    <button type="submit" class="btn btn-outline-primary btn-planifest"> Filtrar 🔎</button>
    <a href="/clients-view" class="btn btn-outline-secondary btn-planifest">Limpiar 🧹</a>
</div>
    </div>
</form>



    <!-- TABLA DE CLIENTES -->
    <div class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">📋 Lista de Clientes</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.name}"></td>
                        <td th:text="${c.email}"></td>
                        <td th:text="${c.phone}"></td>
                        <td class="text-center">
                            <a th:href="@{/clients-view(id=${c.id})}" class="btn btn-sm btn-outline-primary me-1">🖊️</a>
                            <a th:href="@{/clients-view/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger">🗑️</a>
                        </td>
                    </tr>
                    <tr th:if="${clientes.size() == 0}">
                        <td colspan="4" class="text-center text-muted">No hay clientes registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
