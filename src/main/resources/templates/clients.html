<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Planifest - Gestión de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/clients.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/images/planifest.png}" type="image/png">

</head>

<body>
    <div class="container py-5">

        <!-- Mensajes de alerta -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <!-- ENCABEZADO GENERAL -->
        <div class="header-section mb-4 d-flex align-items-center justify-content-center">
            <div class="text-section me-3 text-end">
                <h1 class="mb-0">Gestión de Clientes</h1>
                <p class="mt-2">Agrega, edita o elimina clientes</p>
            </div>
            <div class="logo">
                <img th:src="@{/images/planifestBlanco.png}" alt="Logo Planifest" height="100" width="100">
            </div>
        </div>


        <!-- BOTONES ARRIBA -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a th:href="@{/dashboard/admin}" class="btn btn-outline-secondary btn-sm">Volver</a>
            <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse"
                data-bs-target="#formularioCliente">
                Nuevo cliente
            </button>
        </div>

        <!-- IMPORTAR CLIENTES -->
        <form th:action="@{/api/import-export/client/import}" method="post" enctype="multipart/form-data" class="mb-3">
            <div class="mb-3">
                <label for="fileClient" class="form-label">Importar clientes desde Excel/CSV</label>
                <input class="form-control" type="file" name="file" id="fileClient" required>
            </div>
            <button type="submit" class="btn btn-success">Importar Clientes</button>
        </form>

        <!-- FORMULARIO -->
        <div th:class="${client != null and client.id != null} ? 'collapse show' : 'collapse'" id="formularioCliente">
            <div class="card mb-4">
                <div class="card-header custom-header">
                    <h5 class="mb-0"
                        th:text="${client != null and client.id != null} ? 'Editar Cliente' : 'Nuevo Cliente'">
                        Formulario
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/clients-view/save}" method="post" th:object="${client}">
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{name}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" th:field="*{email}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" th:field="*{phone}" class="form-control" required />
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-success">
                                <span th:text="${client != null and client.id != null} ? 'Actualizar' : 'Guardar'">
                                    Guardar
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- FILTROS -->
        <form method="get" th:action="@{/clients-view}" class="mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" th:value="${nombre}"
                        placeholder="Diana ...">
                </div>
                <div class="col-md-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" th:value="${email}"
                        placeholder="nombre@gmail.com">
                </div>
                <div class="col-md-2 filtro-botones">
                    <button type="submit" class="btn btn-outline-primary btn-planifest">Filtrar</button>
                    <a href="/clients-view" class="btn btn-outline-secondary btn-planifest">Limpiar</a>
                </div>
            </div>
        </form>

        <!-- TABLA DE CLIENTES -->
        <div class="card">
            <div class="card-header custom-header">
                <h5 class="mb-0">Lista de Clientes</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="custom-thead">
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clientes}">
                            <td th:text="${c.name}"></td>
                            <td th:text="${c.email}"></td>
                            <td th:text="${c.phone}"></td>
                            <td class="text-center">
                                <a th:href="@{/clients-view(id=${c.id})}"
                                    class="btn btn-sm btn-outline-primary me-1">Editar</a>

                                <!-- CONFIRMACIÓN DE ELIMINAR -->
                                <a th:href="@{/clients-view/delete/{id}(id=${c.id})}"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Seguro que deseas eliminar este cliente?');">
                                    Eliminar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${clientes.size() == 0}">
                            <td colspan="4" class="text-center text-muted">No hay clientes registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
