<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - PLANIFEST</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #d2b48c;
      font-family: Arial, sans-serif;
    }

    .login-container {
      max-width: 400px;
      margin: 10vh auto;
      padding: 30px;
      background-color: #1c1c1c;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(210,180,140,0.3);
    }

    .form-control {
      background-color: #000;
      color: #d2b48c;
      border: 1px solid #d2b48c;
    }

    .form-control:focus {
      box-shadow: 0 0 5px #d2b48c;
    }

    .btn-custom {
      background-color: #c6996f;
      color: white;
      border-radius: 30px;
    }

    .btn-custom:hover {
      background-color: #5d4037;
    }

    a {
      color: #d2b48c;
      text-decoration: none;
    }

    a:hover {
      color: #b8860b;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2 class="text-center mb-4">Iniciar Sesión</h2>
    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Correo o Usuario</label>
        <input type="text" class="form-control" id="username" name="username" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" required />
      </div>
      <button type="submit" class="btn btn-custom w-100">Entrar</button>
    </form>
    <div class="text-center mt-3">
      <span>¿No tienes cuenta?</span>
      <a href="./registro.html">Regístrate aquí</a>
    </div>
  </div>
</body>
</html>
