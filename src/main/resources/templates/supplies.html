<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Insumos - Catering Soft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/supply.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <div class="card card-custom p-4">
        <h2 class="gold-title fw-bold mb-4">Lista de Insumos</h2>

        <div class="d-flex justify-content-end mb-3">
            <a th:href="@{/empleados/create}" class="btn btn-success me-2">Añadir Empleado</a>
            <a th:href="@{/dashboard/admin}" class="btn btn-success">Volver al Dashboard</a>
        </div>

        <!-- Formulario de Filtro -->
        <form method="GET" th:action="@{/supplies-view}" class="row g-3 mb-4">
            <div class="col-md-4">
                <label for="nombre" class="form-label">Buscar por nombre</label>
                <input type="text" name="nombre" id="nombre" class="form-control"
                       th:value="${param.nombre}" placeholder="Ej: Arroz, Azúcar...">
            </div>

            <div class="col-md-3">
                <label for="cantidad_minima" class="form-label">Cantidad mínima</label>
                <input type="number" name="cantidad_minima" id="cantidad_minima" class="form-control"
                       th:valueq="${param.cantidad_minima}" min="0">
            </div>

            <div class="col-md-4">
                <label for="evento" class="form-label">Evento asociado</label>
                <select name="evento" id="evento" class="form-select">
                    <option value="">-- Todos --</option>
                    <option th:each="evento : ${events}"
                            th:value="${evento.id}"
                            th:selected="${param.evento} == ${evento.id}"
                            th:text="${evento.name}">Evento</option>
                </select>
            </div>

            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-outline-success w-100">Filtrar</button>
            </div>
        </form>

        <!-- Tabla de Insumos -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Stock actual</th>
                        <th>Eventos asociados</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="insumo : ${supplies}">
                        <td th:text="${insumo.id}">1</td>
                        <td th:text="${insumo.name}">Nombre</td>
                        <td th:text="${insumo.description != null ? insumo.description : 'Sin descripción'}">Descripción</td>
                        <td th:text="${insumo.currentStock}">0</td>
                        <td>
                            <span th:if="${#lists.isEmpty(insumo.events)}" class="text-muted">Sin evento</span>
                            <span th:each="evento : ${insumo.events}">
                                <span class="badge bg-secondary" th:text="${evento.name}">Evento</span><br>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{'/supplies-view/editar/' + ${insumo.id}}" class="btn btn-sm btn-primary">Editar</a>
                            <a th:href="@{'/supplies-view/delete/' + ${insumo.id}}" class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Estás seguro de eliminar este insumo?');">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(supplies)}">
                        <td colspan="6" class="text-center text-muted">No hay insumos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
